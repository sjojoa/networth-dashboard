<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Net worth dashboard</title>
<style>
  :root {
    color-scheme: light;
    --surface-1: #fcfcfb;
    --page: #f9f9f7;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #898781;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --border: rgba(11,11,11,0.10);
    --ghost: rgba(11,11,11,0.04);
    --up: #006300;
    --down: #d03b3b;
    --c-1: #2a78d6;  /* net worth · Cash */
    --c-2: #eb6834;  /* Bonds · plot slot 1 */
    --c-3: #1baf7a;  /* Retirement · plot slot 2 */
    --c-4: #eda100;  /* Taxable investing · plot slot 3 */
    --c-5: #e87ba4;  /* spare category · owner 2 */
    --c-6: #008300;  /* owner 1 */
    --c-7: #4a3aa7;  /* liability 2 · plot slot 4 · owner 3 */
    --c-8: #e34948;  /* liability 1 */
    --spark: #898781;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1: #1a1a19;
    --page: #0d0d0d;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255,255,255,0.10);
    --ghost: rgba(255,255,255,0.06);
    --up: #0ca30c;
    --down: #e66767;   /* stepped for the dark surface: 5.4:1, so small red text still clears 4.5 */
    --c-1: #3987e5;
    --c-2: #d95926;
    --c-3: #199e70;
    --c-4: #c98500;
    --c-5: #d55181;
    --c-6: #008300;
    --c-7: #9085e9;
    --c-8: #e66767;
    --spark: #898781;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 14px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 28px 24px 64px; }

  header.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  h1 { font-size: 20px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--text-muted); font-size: 12.5px; margin-top: 3px; }

  button {
    font: inherit; font-size: 13px; color: var(--text-secondary);
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 13px; cursor: pointer; min-height: 34px;
  }
  button:hover:not(:disabled) { background: var(--ghost); }
  button[aria-pressed="true"] { color: var(--text-primary); font-weight: 600; background: var(--ghost); border-color: var(--axis); }
  button:disabled { opacity: 0.42; cursor: not-allowed; }
  button:focus-visible, summary:focus-visible { outline: 2px solid var(--c-1); outline-offset: 2px; }

  .filters { display: flex; align-items: center; gap: 8px 10px; flex-wrap: wrap; margin: 22px 0 6px; }
  .filters .label { color: var(--text-muted); font-size: 12px; margin: 0 2px 0 0; }
  .filters .spacer { flex: 1 1 auto; }
  .filter-note { color: var(--text-muted); font-size: 12px; padding-bottom: 18px; border-bottom: 1px solid var(--border); min-height: 18px; }
  .filter-note .sep { opacity: 0.5; margin: 0 6px; }

  .seg { display: flex; }
  .seg button { border-radius: 0; margin-left: -1px; }
  .seg button:first-child { border-radius: 8px 0 0 8px; margin-left: 0; }
  .seg button:last-child { border-radius: 0 8px 8px 0; }
  .seg button[aria-pressed="true"] { position: relative; z-index: 1; }
  .seg .dot { width: 8px; height: 8px; border-radius: 3px; display: inline-block; margin-right: 6px; vertical-align: -1px; }

  .dates { display: none; align-items: center; gap: 6px; }
  .dates.on { display: inline-flex; }
  input[type="date"] {
    font: inherit; font-size: 13px; color: var(--text-primary); background: var(--surface-1);
    border: 1px solid var(--border); border-radius: 8px; padding: 6px 9px; min-height: 34px;
  }
  input[type="date"]:focus-visible { outline: 2px solid var(--c-1); outline-offset: 1px; }

  .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 20px; position: relative; }
  .card h2 { font-size: 14px; font-weight: 600; margin: 0; }
  .card .note { color: var(--text-muted); font-size: 12px; margin-top: 2px; }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; min-height: 30px; }
  .card-head .ctl { display: flex; align-items: center; gap: 8px; }
  .card-head .ctl button { font-size: 12.5px; padding: 5px 10px; min-height: 30px; }

  .dd { position: relative; }
  .dd summary {
    list-style: none; cursor: pointer; font-size: 12.5px; color: var(--text-secondary);
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px;
    padding: 5px 10px; min-height: 30px; display: inline-flex; align-items: center; gap: 6px;
  }
  .dd summary::-webkit-details-marker { display: none; }
  .dd summary:hover { background: var(--ghost); }
  .dd[open] summary { color: var(--text-primary); border-color: var(--axis); background: var(--ghost); }
  .dd-menu {
    position: absolute; right: 0; top: calc(100% + 6px); z-index: 20; width: 306px;
    max-height: 420px; overflow-y: auto; background: var(--surface-1);
    border: 1px solid var(--axis); border-radius: 10px; padding: 8px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.16);
  }
  .dd-menu .grp {
    font-size: 11px; color: var(--text-muted); padding: 10px 8px 4px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .dd-menu .grp:first-child { padding-top: 4px; }
  .dd-menu label {
    display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 7px;
    font-size: 12.5px; cursor: pointer; min-height: 30px;
  }
  .dd-menu label:hover { background: var(--ghost); }
  .dd-menu label.off { opacity: 0.42; cursor: not-allowed; }
  .dd-menu label .nm { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dd-menu label .vl { color: var(--text-muted); font-variant-numeric: tabular-nums; font-size: 11.5px; }
  .dd-menu .key { width: 15px; height: 2px; border-radius: 2px; flex: none; background: var(--axis); }
  .dd-menu .hint { font-size: 11.5px; color: var(--text-muted); padding: 6px 8px 2px; border-top: 1px solid var(--border); margin-top: 6px; }

  .hero-row { display: grid; grid-template-columns: minmax(260px, 1fr) 2fr; gap: 16px; align-items: stretch; }
  .hero .label { color: var(--text-secondary); font-size: 13px; }
  .hero .figure { font-size: 44px; font-weight: 600; letter-spacing: -0.025em; margin: 6px 0 2px; line-height: 1.05; }
  .hero .delta { font-size: 14px; font-weight: 600; }
  .hero .delta span.sub2 { font-weight: 400; color: var(--text-muted); }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-top: 12px; }
  .tile .label { color: var(--text-secondary); font-size: 12.5px; }
  .tile .value { font-size: 21px; font-weight: 600; letter-spacing: -0.015em; margin-top: 3px; }
  .tile .delta { font-size: 12px; margin-top: 2px; font-weight: 600; white-space: nowrap; }

  .up { color: var(--up); }
  .down { color: var(--down); }
  .flat { color: var(--text-muted); }
  /* A negative balance is money owed — carry it in the same red wherever the
     figure appears, and beat the muted color the board totals set. */
  .value.owed, .board-head .tot .amt.owed { color: var(--down); }
  .board-head .tot .up { color: var(--up); }
  .board-head .tot .down { color: var(--down); }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
  .stack { margin-top: 16px; }

  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin: 12px 0 4px; }
  .legend .item { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text-secondary); }
  .legend .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .legend .ln { width: 15px; height: 2px; border-radius: 2px; flex: none; }

  .plot { position: relative; }
  .empty { color: var(--text-muted); font-size: 12.5px; padding: 34px 0; text-align: center; }
  svg { display: block; width: 100%; overflow: visible; }
  svg:focus-visible { outline: 2px solid var(--c-1); outline-offset: 4px; border-radius: 6px; }
  .tick { fill: var(--text-muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .mark-label { font-size: 11.5px; font-weight: 600; fill: var(--text-primary); }

  .tip {
    position: absolute; pointer-events: none; opacity: 0; transition: opacity .1s;
    background: var(--surface-1); border: 1px solid var(--axis); border-radius: 9px;
    padding: 9px 11px; font-size: 12.5px; min-width: 152px; z-index: 5;
    box-shadow: 0 6px 20px rgba(0,0,0,0.13);
  }
  .tip .t-date { color: var(--text-muted); font-size: 11.5px; margin-bottom: 5px; }
  .tip .t-row { display: flex; align-items: center; gap: 10px; justify-content: space-between; white-space: nowrap; }
  .tip .t-row .nm { display: inline-flex; align-items: center; gap: 6px; color: var(--text-secondary); }
  .tip .t-row .vl { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--text-primary); }
  .tip .t-row .vl .paren { font-weight: 400; color: var(--text-muted); }
  .tip .t-sep { height: 1px; background: var(--border); margin: 6px 0; }
  .tip .key { width: 13px; height: 2px; border-radius: 2px; flex: none; }

  .board-group { margin-top: 22px; }
  .board-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
  .board-head .nm { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; }
  .board-head .dot { width: 9px; height: 9px; border-radius: 3px; }
  .board-head .tot { color: var(--text-muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(252px, 1fr)); gap: 12px; }
  .acct .top { display: flex; align-items: flex-start; gap: 8px; }
  .acct .nm { font-size: 13px; font-weight: 600; min-width: 0; }
  .acct .value { font-size: 20px; font-weight: 600; letter-spacing: -0.015em; margin-top: 8px; }
  .acct .meta { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; font-size: 12px; margin-top: 2px; flex-wrap: wrap; }
  .acct .share { color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .acct .spark { margin-top: 10px; width: 100%; height: auto; }
  .acct.is-closed { opacity: 0.72; }
  .acct .asof { font-size: 11.5px; color: var(--text-muted); margin-top: 3px; }
  td.carried { color: var(--text-muted); font-style: italic; }
  .acct .plotbtn {
    position: absolute; right: 12px; bottom: 12px; font-size: 11px; padding: 3px 9px;
    min-height: 24px; border-radius: 7px; opacity: 0; transition: opacity .12s;
  }
  .acct:hover .plotbtn, .acct .plotbtn:focus-visible, .acct .plotbtn[aria-pressed="true"] { opacity: 1; }

  .chip {
    font-size: 10.5px; border-radius: 999px; padding: 2px 8px; font-weight: 600;
    white-space: nowrap; flex: none; margin-left: auto; position: relative;
    color: var(--text-primary); isolation: isolate;
  }
  .chip::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit;
    background: var(--own); opacity: 0.16; z-index: -1;
  }
  .chip .dot { width: 6px; height: 6px; border-radius: 999px; background: var(--own); display: inline-block; margin-right: 5px; vertical-align: 0.5px; }
  .chip.closed { color: var(--text-secondary); border: 1px solid var(--border); }
  .chip.closed::before { background: none; }

  table { border-collapse: collapse; width: 100%; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  th, td { padding: 7px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--border); }
  th { color: var(--text-secondary); font-weight: 600; position: sticky; top: 0; background: var(--surface-1); }
  th:first-child, td:first-child { text-align: left; position: sticky; left: 0; background: var(--surface-1); }
  .scroll { overflow-x: auto; max-height: 560px; overflow-y: auto; margin-top: 12px; }
  tbody tr:hover td { background: var(--ghost); }

  .tabs { display: flex; gap: 2px; margin-top: 18px; border-bottom: 1px solid var(--border); }
  .tabs button {
    border: none; background: none; border-radius: 6px 6px 0 0; margin-bottom: -1px;
    border-bottom: 2px solid transparent; padding: 8px 14px;
  }
  .tabs button[aria-selected="true"] { color: var(--text-primary); font-weight: 600; border-bottom-color: var(--c-1); }
  body.view-proj .dash-only { display: none !important; }

  .proj-row { display: grid; grid-template-columns: minmax(320px, 1fr) 1.8fr; gap: 16px; align-items: start; margin-top: 20px; }
  .proj-group { padding: 14px 0; border-bottom: 1px solid var(--border); }
  .proj-group:first-of-type { padding-top: 10px; }
  .proj-group .hd { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .proj-group .nm { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; }
  .proj-group .nm .dot { width: 9px; height: 9px; border-radius: 3px; }
  .proj-group .bal { color: var(--text-muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
  .fld { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--text-secondary); }
  .fld .in {
    display: flex; align-items: center; background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 8px; min-height: 34px; padding: 0 9px; gap: 4px;
  }
  .fld .in:focus-within { outline: 2px solid var(--c-1); outline-offset: 1px; }
  .fld .affix { color: var(--text-muted); font-size: 13px; }
  .fld input {
    font: inherit; font-size: 13px; color: var(--text-primary); background: none; border: none;
    outline: none; width: 100%; min-width: 0; padding: 6px 0; font-variant-numeric: tabular-nums;
  }
  .proj-globals { padding-top: 14px; }
  .adv {
    display: inline-flex; align-items: center; gap: 6px; margin-top: 8px;
    font-size: 12px; color: var(--text-secondary); cursor: pointer;
  }
  .adv input { margin: 0; accent-color: var(--c-1); }
  .adv:has(input:disabled) { opacity: 0.55; cursor: not-allowed; }
  .proj-acct { margin-top: 12px; padding-left: 12px; border-left: 2px solid var(--border); }
  .proj-acct .hd { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .proj-acct .anm { font-size: 12.5px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
  .proj-acct .chip { margin-left: 0; }
  .proj-acct .fields { margin-top: 6px; }

  @media (max-width: 900px) {
    .hero-row, .grid2, .proj-row { grid-template-columns: 1fr; }
    .dd-menu { right: auto; left: 0; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Net worth dashboard</h1>
      <div class="sub" id="sourceNote"></div>
    </div>
    <button id="themeBtn" type="button">Dark mode</button>
  </header>

  <nav class="tabs" role="tablist" aria-label="Views">
    <button type="button" role="tab" id="tabDash" data-view="dash" aria-controls="dashView" aria-selected="true">Overview</button>
    <button type="button" role="tab" id="tabProj" data-view="proj" aria-controls="projView" aria-selected="false">Projection</button>
  </nav>

  <div class="filters" id="filters" role="group" aria-label="Dashboard filters">
    <span class="label dash-only">Range</span>
    <div class="seg dash-only" id="rangeSeg"></div>
    <div class="dates dash-only" id="dateInputs">
      <input type="date" id="dateFrom" aria-label="Range start">
      <span class="label">to</span>
      <input type="date" id="dateTo" aria-label="Range end">
    </div>
    <span class="label" id="ownerLabel">Owner</span>
    <div class="seg" id="ownerSeg"></div>
    <span class="label dash-only">Values</span>
    <div class="seg dash-only" id="modeSeg">
      <button type="button" data-mode="money" aria-pressed="true" title="Show dollar amounts">$</button>
      <button type="button" data-mode="pct" aria-pressed="false" title="Show percentages">%</button>
    </div>
    <button id="closedBtn" class="dash-only" type="button" aria-pressed="false" hidden></button>
    <span class="spacer"></span>
    <button id="tableBtn" class="dash-only" type="button" aria-pressed="false">Table view</button>
  </div>
  <div class="filter-note dash-only" id="filterNote"></div>

  <div id="dashView" role="tabpanel" aria-labelledby="tabDash">
  <div class="hero-row" style="margin-top:20px">
    <div class="card hero">
      <div class="label" id="heroLabel">Net worth</div>
      <div class="figure" id="heroValue">—</div>
      <div class="delta" id="heroDelta"></div>
      <div class="tiles" style="grid-template-columns: 1fr 1fr; margin-top: 18px;" id="heroTiles"></div>
    </div>

    <div class="card">
      <div class="card-head">
        <h2 id="nwTitle">Net worth over time</h2>
        <div class="ctl">
          <details class="dd" id="plotDd">
            <summary id="plotSummary">Plot series</summary>
            <div class="dd-menu" id="plotMenu"></div>
          </details>
        </div>
      </div>
      <div class="note" id="nwNote"></div>
      <div class="legend" id="nwLegend"></div>
      <div class="plot" id="nwPlot"><div class="tip" id="nwTip"></div></div>
    </div>
  </div>

  <div class="tiles" id="tiles"></div>

  <div class="card stack">
    <h2>Assets by category</h2>
    <div class="note" id="assetNote"></div>
    <div class="legend" id="assetLegend"></div>
    <div class="plot" id="assetPlot"><div class="tip" id="assetTip"></div></div>
  </div>

  <div class="grid2">
    <div class="card">
      <h2 id="liabTitle">Balances owed</h2>
      <div class="note" id="liabNote"></div>
      <div class="legend" id="liabLegend"></div>
      <div class="plot" id="liabPlot"><div class="tip" id="liabTip"></div></div>
    </div>

    <div class="card">
      <h2>Change by account</h2>
      <div class="note" id="changeNote"></div>
      <div class="legend">
        <span class="item"><span class="sw" style="background: var(--c-1)"></span>Added to net worth</span>
        <span class="item"><span class="sw" style="background: var(--c-8)"></span>Subtracted from net worth</span>
      </div>
      <div class="plot" id="changePlot"></div>
    </div>
  </div>

  <div class="stack">
    <h2 style="font-size:15px; font-weight:600; margin:0 0 2px;">Accounts</h2>
    <div class="sub" id="boardNote"></div>
    <div id="board"></div>
  </div>

  <div class="card stack" id="tableCard" hidden>
    <h2>All snapshots</h2>
    <div class="note" id="tableNote"></div>
    <div class="scroll" id="tableWrap"></div>
  </div>
  </div>

  <div id="projView" role="tabpanel" aria-labelledby="tabProj" hidden>
    <div class="proj-row">
      <div class="card">
        <h2>Assumptions</h2>
        <div class="note" id="projScope"></div>
        <div id="projForm"></div>
        <div class="proj-globals fields">
          <label class="fld"><span>Years to project</span>
            <span class="in"><input type="number" id="projYears" min="1" max="60" step="1" inputmode="numeric"><span class="affix">yrs</span></span></label>
          <label class="fld"><span>Inflation</span>
            <span class="in"><input type="number" id="projInflation" min="0" max="20" step="0.1" inputmode="decimal"><span class="affix">%/yr</span></span></label>
        </div>
        <label class="adv" style="margin-top:14px"><input type="checkbox" id="projRaiseOn">Increase contributions each year</label>
        <div class="fields" id="projRaiseFields" hidden>
          <label class="fld"><span>Yearly increase</span>
            <span class="in"><input type="number" id="projRaisePct" min="0" max="50" step="0.5" inputmode="decimal"><span class="affix">%/yr</span></span></label>
        </div>
        <div class="note" id="projFlatNote" style="margin-top:12px"></div>
      </div>

      <div class="card">
        <div class="card-head">
          <h2>Projected net worth</h2>
          <div class="ctl seg" id="projDollarSeg">
            <button type="button" data-real="0" aria-pressed="true" title="Future dollars, not adjusted for inflation">Nominal</button>
            <button type="button" data-real="1" aria-pressed="false" title="Adjusted for inflation into today's purchasing power">Today's $</button>
          </div>
        </div>
        <div class="note" id="projNote"></div>
        <div class="legend" id="projLegend"></div>
        <div class="plot" id="projPlot"><div class="tip" id="projTip"></div></div>
      </div>
    </div>

    <div class="tiles" id="projTiles"></div>

    <div class="card stack">
      <h2>Year by year</h2>
      <div class="note" id="projTableNote"></div>
      <div class="scroll" id="projTableWrap"></div>
    </div>
  </div>
</div>

<script>
"use strict";
const DATA = /*__DATA__*/null;

/* ── color roles ───────────────────────────────────────────────────────────
   Every set below was checked with the data-viz palette validator (lightness
   band, chroma floor, CVD separation, normal-vision floor, contrast) in BOTH
   light and dark mode. Don't reorder without re-validating — the ordering is
   what keeps adjacent series distinguishable.                               */
const CATEGORY_VAR_FIXED = {
  "Cash": "--c-1",
  "Bonds": "--c-2",
  "Retirement": "--c-3",
