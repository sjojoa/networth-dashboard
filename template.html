<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Net worth dashboard</title>
<style>
  :root {
    color-scheme: light;
    --surface-1: #fcfcfb;
    --page: #f9f9f7;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #898781;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --border: rgba(11,11,11,0.10);
    --ghost: rgba(11,11,11,0.04);
    --up: #006300;
    --down: #d03b3b;
    --c-1: #2a78d6;  /* net worth · Cash */
    --c-2: #eb6834;  /* Bonds · plot slot 1 */
    --c-3: #1baf7a;  /* Retirement · plot slot 2 · owner 3 */
    --c-4: #eda100;  /* Taxable investing · plot slot 3 · owner 2 */
    --c-5: #e87ba4;  /* spare category */
    --c-6: #008300;  /* liability 3 */
    --c-7: #4a3aa7;  /* liability 2 · plot slot 4 · owner 1 */
    --c-8: #e34948;  /* liability 1 */
    --spark: #898781;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1: #1a1a19;
    --page: #0d0d0d;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255,255,255,0.10);
    --ghost: rgba(255,255,255,0.06);
    --up: #0ca30c;
    --down: #e66767;   /* stepped for the dark surface: 5.4:1, so small red text still clears 4.5 */
    --c-1: #3987e5;
    --c-2: #d95926;
    --c-3: #199e70;
    --c-4: #c98500;
    --c-5: #d55181;
    --c-6: #008300;
    --c-7: #9085e9;
    --c-8: #e66767;
    --spark: #898781;
  }

  * { box-sizing: border-box; }
  /* Classes below set display (grid, flex); without this they'd override the hidden attribute. */
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 14px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 28px 24px 64px; }

  header.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  h1 { font-size: 20px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--text-muted); font-size: 12.5px; margin-top: 3px; }

  button {
    font: inherit; font-size: 13px; color: var(--text-secondary);
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 13px; cursor: pointer; min-height: 34px;
  }
  button:hover:not(:disabled) { background: var(--ghost); }
  button[aria-pressed="true"] { color: var(--text-primary); font-weight: 600; background: var(--ghost); border-color: var(--axis); }
  button:disabled { opacity: 0.42; cursor: not-allowed; }
  button:focus-visible, summary:focus-visible { outline: 2px solid var(--c-1); outline-offset: 2px; }

  .filters { display: flex; align-items: center; gap: 8px 10px; flex-wrap: wrap; margin: 22px 0 6px; }
  .filters .label { color: var(--text-muted); font-size: 12px; margin: 0 2px 0 0; }
  .filters .spacer { flex: 1 1 auto; }
  .filters .filter-end { display: inline-flex; gap: 10px; margin-left: auto; }
  .filter-note { color: var(--text-muted); font-size: 12px; padding-bottom: 18px; border-bottom: 1px solid var(--border); min-height: 18px; }
  .filter-note .sep { opacity: 0.5; margin: 0 6px; }

  .seg { display: flex; }
  .seg button { border-radius: 0; margin-left: -1px; }
  .seg button:first-child { border-radius: 8px 0 0 8px; margin-left: 0; }
  .seg button:last-child { border-radius: 0 8px 8px 0; }
  .seg button[aria-pressed="true"] { position: relative; z-index: 1; }
  .seg .dot { width: 8px; height: 8px; border-radius: 3px; display: inline-block; margin-right: 6px; vertical-align: -1px; }

  .dates { display: none; align-items: center; gap: 6px; }
  .dates.on { display: inline-flex; }
  input[type="date"] {
    font: inherit; font-size: 13px; color: var(--text-primary); background: var(--surface-1);
    border: 1px solid var(--border); border-radius: 8px; padding: 6px 9px; min-height: 34px;
  }
  input[type="date"]:focus-visible { outline: 2px solid var(--c-1); outline-offset: 1px; }

  .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 20px; position: relative; }
  .card h2 { font-size: 14px; font-weight: 600; margin: 0; }
  .card .note { color: var(--text-muted); font-size: 12px; margin-top: 2px; }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; min-height: 30px; }
  .card-head .ctl { display: flex; align-items: center; gap: 8px; }
  .card-head .ctl button { font-size: 12.5px; padding: 5px 10px; min-height: 30px; }

  .dd { position: relative; }
  .dd summary {
    list-style: none; cursor: pointer; font-size: 12.5px; color: var(--text-secondary);
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px;
    padding: 5px 10px; min-height: 30px; display: inline-flex; align-items: center; gap: 6px;
  }
  .dd summary::-webkit-details-marker { display: none; }
  .dd summary:hover { background: var(--ghost); }
  .dd[open] summary { color: var(--text-primary); border-color: var(--axis); background: var(--ghost); }
  .dd-menu {
    position: absolute; right: 0; top: calc(100% + 6px); z-index: 20; width: 306px;
    max-height: 420px; overflow-y: auto; background: var(--surface-1);
    border: 1px solid var(--axis); border-radius: 10px; padding: 8px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.16);
  }
  .dd-menu .grp {
    font-size: 11px; color: var(--text-muted); padding: 10px 8px 4px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .dd-menu .grp:first-child { padding-top: 4px; }
  .dd-menu label {
    display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 7px;
    font-size: 12.5px; cursor: pointer; min-height: 30px;
  }
  .dd-menu label:hover { background: var(--ghost); }
  .dd-menu label.off { opacity: 0.42; cursor: not-allowed; }
  .dd-menu label .nm { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dd-menu label .vl { color: var(--text-muted); font-variant-numeric: tabular-nums; font-size: 11.5px; }
  .dd-menu .key { width: 15px; height: 2px; border-radius: 2px; flex: none; background: var(--axis); }
  .dd-menu .hint { font-size: 11.5px; color: var(--text-muted); padding: 6px 8px 2px; border-top: 1px solid var(--border); margin-top: 6px; }

  .hero-row { display: grid; grid-template-columns: minmax(260px, 1fr) 2fr; gap: 16px; align-items: stretch; }
  .hero .label { color: var(--text-secondary); font-size: 13px; }
  .hero .figure { font-size: 44px; font-weight: 600; letter-spacing: -0.025em; margin: 6px 0 2px; line-height: 1.05; }
  .hero .delta { font-size: 14px; font-weight: 600; }
  .hero .delta span.sub2 { font-weight: 400; color: var(--text-muted); }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-top: 12px; }
  .tile .label { color: var(--text-secondary); font-size: 12.5px; }
  .tile .value { font-size: 21px; font-weight: 600; letter-spacing: -0.015em; margin-top: 3px; }
  .tile .delta { font-size: 12px; margin-top: 2px; font-weight: 600; white-space: nowrap; }

  .up { color: var(--up); }
  .down { color: var(--down); }
  .flat { color: var(--text-muted); }
  /* A negative balance is money owed — carry it in the same red wherever the
     figure appears, and beat the muted color the board totals set. */
  .value.owed, .board-head .tot .amt.owed { color: var(--down); }
  .board-head .tot .up { color: var(--up); }
  .board-head .tot .down { color: var(--down); }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
  .stack { margin-top: 16px; }

  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin: 12px 0 4px; }
  .legend .item { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text-secondary); }
  .legend .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .legend .ln { width: 15px; height: 2px; border-radius: 2px; flex: none; }

  .plot { position: relative; }
  .empty { color: var(--text-muted); font-size: 12.5px; padding: 34px 0; text-align: center; }
  svg { display: block; width: 100%; overflow: visible; }
  svg:focus-visible { outline: 2px solid var(--c-1); outline-offset: 4px; border-radius: 6px; }
  .tick { fill: var(--text-muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .mark-label { font-size: 11.5px; font-weight: 600; fill: var(--text-primary); }

  .tip {
    position: absolute; pointer-events: none; opacity: 0; transition: opacity .1s;
    background: var(--surface-1); border: 1px solid var(--axis); border-radius: 9px;
    padding: 9px 11px; font-size: 12.5px; min-width: 152px; z-index: 5;
    box-shadow: 0 6px 20px rgba(0,0,0,0.13);
  }
  .tip .t-date { color: var(--text-muted); font-size: 11.5px; margin-bottom: 5px; }
  .tip .t-row { display: flex; align-items: center; gap: 10px; justify-content: space-between; white-space: nowrap; }
  .tip .t-row .nm { display: inline-flex; align-items: center; gap: 6px; color: var(--text-secondary); }
  .tip .t-row .vl { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--text-primary); }
  .tip .t-row .vl .paren { font-weight: 400; color: var(--text-muted); }
  .tip .t-sep { height: 1px; background: var(--border); margin: 6px 0; }
  .tip .key { width: 13px; height: 2px; border-radius: 2px; flex: none; }

  .board-group { margin-top: 22px; }
  /* Above the cards that follow, so a help tip opening downward isn't covered. */
  .board-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; position: relative; z-index: 3; flex-wrap: wrap; }
  .board-head .nm { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; }
  .board-head .dot { width: 9px; height: 9px; border-radius: 3px; }
  .board-head .tot { color: var(--text-muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .help {
    position: relative; display: inline-flex; align-items: center; justify-content: center;
    width: 15px; height: 15px; margin-left: 4px; vertical-align: 1px; border-radius: 999px;
    border: 1px solid var(--axis); color: var(--text-secondary); font-size: 10px; font-weight: 600;
    cursor: help; font-variant-numeric: normal;
  }
  .help:focus-visible { outline: 2px solid var(--c-1); outline-offset: 2px; }
  .help .help-tip {
    position: absolute; left: -12px; top: calc(100% + 8px); z-index: 30; width: 280px; max-width: 80vw;
    background: var(--surface-1); border: 1px solid var(--axis); border-radius: 9px; padding: 9px 11px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.13); color: var(--text-secondary); font-size: 12px;
    font-weight: 400; line-height: 1.45; text-align: left; white-space: normal;
    opacity: 0; visibility: hidden; transition: opacity .1s;
  }
  .help .help-tip b { color: var(--text-primary); font-weight: 600; }
  .help:hover .help-tip, .help:focus .help-tip { opacity: 1; visibility: visible; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(252px, 1fr)); gap: 12px; }
  .acct .top { display: flex; align-items: flex-start; gap: 8px; }
  .acct .nm { font-size: 13px; font-weight: 600; min-width: 0; }
  .acct .value { font-size: 20px; font-weight: 600; letter-spacing: -0.015em; margin-top: 8px; }
  .acct .meta { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; font-size: 12px; margin-top: 2px; flex-wrap: wrap; }
  .acct .share { color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .acct .spark { margin-top: 10px; width: 100%; height: auto; }
  .acct.is-closed { opacity: 0.72; }
  .acct.is-excluded { opacity: 0.6; border-style: dashed; }
  .acct.is-excluded .value.owed { color: var(--text-secondary); }
  .acct .plotbtn.incl { opacity: 1; }
  .chip.excl { color: var(--text-secondary); border: 1px dashed var(--axis); }
  .chip.excl::before { background: none; }
  .chip.excl + .chip { margin-left: 0; }
  .hero .incl { color: var(--text-secondary); font-size: 13px; margin-top: 6px; }
  .hero .incl b { font-weight: 600; color: var(--text-primary); font-variant-numeric: tabular-nums; }
  .filters .dd summary { font-size: 13px; padding: 7px 13px; min-height: 34px; }
  .dd.on summary { color: var(--text-primary); font-weight: 600; border-color: var(--axis); background: var(--ghost); }
  .acct .asof { font-size: 11.5px; color: var(--text-muted); margin-top: 3px; }
  td.carried { color: var(--text-muted); font-style: italic; }
  .acct .plotbtn {
    position: absolute; right: 12px; bottom: 12px; font-size: 11px; padding: 3px 9px;
    min-height: 24px; border-radius: 7px; opacity: 0; transition: opacity .12s;
  }
  .acct:hover .plotbtn, .acct .plotbtn:focus-visible, .acct .plotbtn[aria-pressed="true"] { opacity: 1; }

  .chip {
    font-size: 10.5px; border-radius: 999px; padding: 2px 8px; font-weight: 600;
    white-space: nowrap; flex: none; margin-left: auto; position: relative;
    color: var(--text-primary); isolation: isolate;
  }
  .chip::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit;
    background: var(--own); opacity: 0.16; z-index: -1;
  }
  .chip .dot { width: 6px; height: 6px; border-radius: 999px; background: var(--own); display: inline-block; margin-right: 5px; vertical-align: 0.5px; }
  .chip.closed { color: var(--text-secondary); border: 1px solid var(--border); }
  .chip.closed::before { background: none; }

  table { border-collapse: collapse; width: 100%; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  th, td { padding: 7px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--border); }
  th { color: var(--text-secondary); font-weight: 600; position: sticky; top: 0; background: var(--surface-1); }
  th:first-child, td:first-child { text-align: left; position: sticky; left: 0; background: var(--surface-1); }
  .scroll { overflow-x: auto; max-height: 560px; overflow-y: auto; margin-top: 12px; }
  tbody tr:hover td { background: var(--ghost); }

  .tabs { display: flex; gap: 2px; margin-top: 18px; border-bottom: 1px solid var(--border); }
  .tabs button {
    border: none; background: none; border-radius: 6px 6px 0 0; margin-bottom: -1px;
    border-bottom: 2px solid transparent; padding: 8px 14px;
  }
  .tabs button[aria-selected="true"] { color: var(--text-primary); font-weight: 600; border-bottom-color: var(--c-1); }
  body.view-proj .dash-only { display: none !important; }

  .proj-row { display: grid; grid-template-columns: minmax(320px, 1fr) 1.8fr; gap: 16px; align-items: start; margin-top: 20px; }
  .proj-group { padding: 14px 0; border-bottom: 1px solid var(--border); }
  .proj-group:first-of-type { padding-top: 10px; }
  .proj-group .hd { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .proj-group .nm { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; }
  .proj-group .nm .dot { width: 9px; height: 9px; border-radius: 3px; }
  .proj-group .bal { color: var(--text-muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
  .fld { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--text-secondary); }
  .fld .in {
    display: flex; align-items: center; background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 8px; min-height: 34px; padding: 0 9px; gap: 4px;
  }
  .fld .in:focus-within { outline: 2px solid var(--c-1); outline-offset: 1px; }
  .fld .affix { color: var(--text-muted); font-size: 13px; }
  .fld input {
    font: inherit; font-size: 13px; color: var(--text-primary); background: none; border: none;
    outline: none; width: 100%; min-width: 0; padding: 6px 0; font-variant-numeric: tabular-nums;
  }
  .proj-globals { padding-top: 14px; }
  .proj-sub { font-size: 11px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; margin-top: 18px; }
  .loan-sum { font-size: 12px; color: var(--text-secondary); margin-top: 8px; line-height: 1.45; }
  .loan-sum.warn { color: var(--down); }
  .loan-mode { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 12px; color: var(--text-secondary); }
  .loan-mode .seg button { font-size: 12px; padding: 3px 10px; min-height: 26px; }
  .fld select {
    font: inherit; font-size: 13px; color: var(--text-primary); background: none; border: none;
    outline: none; width: 100%; min-width: 0; padding: 6px 0;
  }
  .adv {
    display: inline-flex; align-items: center; gap: 6px; margin-top: 8px;
    font-size: 12px; color: var(--text-secondary); cursor: pointer;
  }
  .adv input { margin: 0; accent-color: var(--c-1); }
  .adv:has(input:disabled) { opacity: 0.55; cursor: not-allowed; }
  .proj-acct { margin-top: 12px; padding-left: 12px; border-left: 2px solid var(--border); }
  .proj-acct .hd { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .proj-acct .anm { font-size: 12.5px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
  .proj-acct .chip { margin-left: 0; }
  .proj-acct .fields { margin-top: 6px; }

  @media (max-width: 900px) {
    .hero-row, .grid2, .proj-row { grid-template-columns: 1fr; }
    .dd-menu { right: auto; left: 0; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Net worth dashboard</h1>
      <div class="sub" id="sourceNote"></div>
    </div>
    <button id="themeBtn" type="button">Dark mode</button>
  </header>

  <nav class="tabs" role="tablist" aria-label="Views">
    <button type="button" role="tab" id="tabDash" data-view="dash" aria-controls="dashView" aria-selected="true">Overview</button>
    <button type="button" role="tab" id="tabProj" data-view="proj" aria-controls="projView" aria-selected="false">Projection</button>
  </nav>

  <div class="filters" id="filters" role="group" aria-label="Dashboard filters">
    <span class="label dash-only">Range</span>
    <div class="seg dash-only" id="rangeSeg"></div>
    <div class="dates dash-only" id="dateInputs">
      <input type="date" id="dateFrom" aria-label="Range start">
      <span class="label">to</span>
      <input type="date" id="dateTo" aria-label="Range end">
    </div>
    <span class="label" id="ownerLabel">Owner</span>
    <div class="seg" id="ownerSeg"></div>
    <span class="label dash-only">Values</span>
    <div class="seg dash-only" id="modeSeg">
      <button type="button" data-mode="money" aria-pressed="true" title="Show dollar amounts">$</button>
      <button type="button" data-mode="pct" aria-pressed="false" title="Show percentages">%</button>
    </div>
    <button id="closedBtn" class="dash-only" type="button" aria-pressed="false" hidden></button>
    <span class="spacer"></span>
    <!-- Kept together so they wrap as a pair rather than stranding one button. -->
    <span class="filter-end">
      <details class="dd" id="exclDd">
        <summary id="exclSummary" title="Leave accounts out of every total">Exclude</summary>
        <div class="dd-menu" id="exclMenu"></div>
      </details>
      <button id="tableBtn" class="dash-only" type="button" aria-pressed="false">Table view</button>
    </span>
  </div>
  <div class="filter-note dash-only" id="filterNote"></div>

  <div id="dashView" role="tabpanel" aria-labelledby="tabDash">
  <div class="hero-row" style="margin-top:20px">
    <div class="card hero">
      <div class="label" id="heroLabel">Net worth</div>
      <div class="figure" id="heroValue">—</div>
      <div class="delta" id="heroDelta"></div>
      <div class="incl" id="heroIncl" hidden></div>
      <div class="tiles" style="grid-template-columns: 1fr 1fr; margin-top: 18px;" id="heroTiles"></div>
    </div>

    <div class="card">
      <div class="card-head">
        <h2 id="nwTitle">Net worth over time</h2>
        <div class="ctl">
          <details class="dd" id="plotDd">
            <summary id="plotSummary">Plot series</summary>
            <div class="dd-menu" id="plotMenu"></div>
          </details>
        </div>
      </div>
      <div class="note" id="nwNote"></div>
      <div class="legend" id="nwLegend"></div>
      <div class="plot" id="nwPlot"><div class="tip" id="nwTip"></div></div>
    </div>
  </div>

  <div class="tiles" id="tiles"></div>

  <div class="card stack">
    <h2>Assets by category</h2>
    <div class="note" id="assetNote"></div>
    <div class="legend" id="assetLegend"></div>
    <div class="plot" id="assetPlot"><div class="tip" id="assetTip"></div></div>
  </div>

  <div class="grid2">
    <div class="card">
      <h2 id="liabTitle">Balances owed</h2>
      <div class="note" id="liabNote"></div>
      <div class="legend" id="liabLegend"></div>
      <div class="plot" id="liabPlot"><div class="tip" id="liabTip"></div></div>
    </div>

    <div class="card">
      <h2>Change by account</h2>
      <div class="note" id="changeNote"></div>

<script>
"use strict";
const DATA = /*__DATA__*/null;

/* ── color roles ───────────────────────────────────────────────────────────
   Every set below was checked with the data-viz palette validator (lightness
   band, chroma floor, CVD separation, normal-vision floor, contrast) in BOTH
   light and dark mode. Don't reorder without re-validating — the ordering is
   what keeps adjacent series distinguishable.                               */
const CATEGORY_VAR_FIXED = {
  "Cash": "--c-1",
  "Bonds": "--c-2",
  "Retirement": "--c-3",
  "Taxable investing": "--c-4",
};
const CATEGORY_POOL = ["--c-1", "--c-2", "--c-3", "--c-4", "--c-5"];
// Liabilities: red, violet, green. Three is the limit — a fourth account
// reuses the first colour, since inventing a ninth hue is worse than
// repeating one. red<->green sits in the 6-8 CVD band, which the legend,
// the 2px segment gaps and the tooltip cover as secondary encoding.
const LIAB_VARS = ["--c-8", "--c-7", "--c-6"];
// Owners: violet, amber, aqua. Green and red already mean up and down on this
// page, and a person shouldn't read as "the good one" or "the bad one" — so
// neither is an owner color, and pink is out for sitting too close to red.
// Blue is out too: it's net worth and "added to net worth". These three pass
// the validator all-pairs in both modes (owners sit side by side in the
// filter bar); amber is under 3:1 on the light surface, so an owner color is
// only ever a dot or tint beside the owner's name, never the text itself.
const OWNER_VARS = ["--c-7", "--c-4", "--c-3"];
// Net worth keeps --c-1; every other plotted line draws from this pool in order.
// blue → orange → aqua → yellow → violet clears every gate in both modes.
const PLOT_POOL = ["--c-2", "--c-3", "--c-4", "--c-7"];
const MAX_PLOT = PLOT_POOL.length;

// Labels are abbreviated to keep all eight on one row; the title carries the
// full wording for anyone hovering.
const RANGES = [
  { id: "all", label: "All", title: "Every snapshot" },
  { id: "365", label: "1y", days: 365, title: "Last 12 months" },
  { id: "ytd", label: "YTD", ytd: true, title: "Since January 1" },
  { id: "180", label: "180d", days: 180, title: "Last 180 days" },
  { id: "90", label: "90d", days: 90, title: "Last 90 days" },
  { id: "30", label: "30d", days: 30, title: "Last 30 days" },
  { id: "7", label: "7d", days: 7, title: "Last 7 days" },
  { id: "custom", label: "Custom", title: "Pick your own dates" },
];

const EXCL_KEY = "nw-excluded";
function loadExcluded() {
  try {
    const saved = JSON.parse(localStorage.getItem(EXCL_KEY));
    if (Array.isArray(saved)) return new Set(saved.filter((n) => typeof n === "string"));
  } catch (e) { /* storage blocked or corrupt */ }
  return new Set();
}
function saveExcluded() {
  try { localStorage.setItem(EXCL_KEY, JSON.stringify(Array.from(state.excluded))); } catch (e) { /* not persisted */ }
}

const state = {
  range: "all",
  from: null,          // ISO date typed into the custom range inputs
  to: null,
  owner: "all",
  showClosed: false,
  mode: "money",       // "money" | "pct"
  showNet: true,
  plotted: [],         // series keys, in the order they were added
  table: false,
  excluded: loadExcluded(),   // account names left out of every total
};
const slotOf = new Map();  // series key -> css var; kept while it stays plotted

/* ── helpers ───────────────────────────────────────────────────────────── */
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* Amounts carry cents everywhere. Anything under half a cent is floating-point
   residue from summing the columns, not money, so it prints as a clean $0.00
   rather than −$0.00 with a red arrow beside it. */
const CENT = 0.005;
function amount(v, withSign) {
  if (Math.abs(v) < CENT) v = 0;
  const sign = v > 0 ? (withSign ? "+" : "") : v < 0 ? "−" : "";
  return sign + "$" + Math.abs(v).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
const money = (v) => amount(v, false);
const signed = (v) => amount(v, true);
const pct = (v) => (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(1) + "%";
const dirClass = (v) => (v > CENT ? "up" : v < -CENT ? "down" : "flat");
const arrow = (v) => (v > CENT ? "▲" : v < -CENT ? "▼" : "–");
const plural = (n, w) => n + " " + w + (n === 1 ? "" : "s");
/* Show a change both ways, leading with whichever the $/% switch is set to.
   A percentage needs a non-zero starting balance, so it may be absent. */
function bothWays(amount, percent, pctFirst) {
  if (percent === null || percent === undefined) return signed(amount);
  return pctFirst ? `${pct(percent)} (${signed(amount)})` : `${signed(amount)} (${pct(percent)})`;
}

function axisMoney(v) {
  const a = Math.abs(v);
  if (a >= 1000) {
    const k = v / 1000;
    return (v < 0 ? "−" : "") + "$" + Math.abs(a >= 10000 ? Math.round(k) : Math.round(k * 10) / 10).toLocaleString("en-US") + "k";
  }
  // Axis ticks stay whole-dollar — they're a scale, not an amount, and "$0.00"
  // as a baseline label is noise.
  return (v < 0 ? "−" : "") + "$" + Math.abs(Math.round(v)).toLocaleString("en-US");
}
// Typographic minus, to match every other negative figure on the page. Past
// 100% the decimal is noise and the label needs the width more.
const axisPct = (v) => {
  const a = Math.abs(v);
  return (v < 0 ? "−" : "") + (a >= 100 ? Math.round(a) : Math.round(a * 10) / 10) + "%";
};
const asDate = (iso) => new Date(iso + "T00:00:00");
const shortDate = (iso) => asDate(iso).toLocaleDateString("en-US", { month: "short", day: "numeric" });
const longDate = (iso) => asDate(iso).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });

/* Pick the round step whose tick COUNT lands closest to the target. Rounding the
   raw step up to the next nice number instead can leave a chart with two
   gridlines (a 0–17% axis stepping by 10). */
function tickStep(min, max, count) {
  const span = max - min;
  if (!(span > 0)) return 1;
  const mag = Math.pow(10, Math.floor(Math.log10(span / Math.max(1, count))));
  let best = mag, bestErr = Infinity;
  [1, 2, 2.5, 5, 10].forEach((mult) => {
    const step = mult * mag;
    const n = Math.round(span / step);
    if (n < 2) return;                       // too few gridlines to read a value off
    const err = Math.abs(n - count);
    if (err < bestErr) { bestErr = err; best = step; }
  });
  return best;
}
function niceTicks(min, max, count) {
  if (min === max) { min -= 1; max += 1; }
  const step = tickStep(min, max, count);
  const out = [];
  for (let t = Math.ceil(min / step) * step; t <= max + step * 1e-6; t += step) out.push(Math.round(t * 1e6) / 1e6);
  return out;
}
function topRoundedRect(x, y, w, h, r) {
  const rr = Math.max(0, Math.min(r, h, w / 2));
  return `M${x},${y + h} L${x},${y + rr} Q${x},${y} ${x + rr},${y} L${x + w - rr},${y} Q${x + w},${y} ${x + w},${y + rr} L${x + w},${y + h} Z`;
}
function endRoundedRectH(x0, x1, y, h, r) {
  const w = Math.abs(x1 - x0);
  const rr = Math.max(0, Math.min(r, w, h / 2));
  const s = x1 >= x0 ? 1 : -1;
  return `M${x0},${y} L${x1 - s * rr},${y} Q${x1},${y} ${x1},${y + rr} L${x1},${y + h - rr} Q${x1},${y + h} ${x1 - s * rr},${y + h} L${x0},${y + h} Z`;
}
/* Pull any date label back inside the drawing box. A label centred on the last
   column of a long history overhangs the right edge, and character-width
   estimates aren't reliable enough — so measure the rendered box and nudge. */
function fitAxisLabels(svg, W) {
  svg.querySelectorAll("text[data-x]").forEach((el) => {
    const b = el.getBBox();
    const over = b.x + b.width - W;
    const under = -b.x;
    if (over > 0) el.setAttribute("x", (parseFloat(el.getAttribute("x")) - over).toFixed(1));
    else if (under > 0) el.setAttribute("x", (parseFloat(el.getAttribute("x")) + under).toFixed(1));
  });
}
function width(el, fallback) {
  const w = el.getBoundingClientRect().width;
  return w > 40 ? w : fallback;
}
function placeTip(tipEl, plotEl, px, py) {
  const pw = plotEl.getBoundingClientRect().width;
  const tw = tipEl.getBoundingClientRect().width || 160;
  let left = px + 14;
  if (left + tw > pw) left = px - tw - 14;
  if (left < 0) left = 0;
  tipEl.style.left = left + "px";
  tipEl.style.top = Math.max(0, py) + "px";
  tipEl.style.opacity = "1";
}
function clearPlot(plotEl, message) {
  const svg = plotEl.querySelector("svg");
  if (svg) svg.remove();
  const old = plotEl.querySelector(".empty");
  if (old) old.remove();
  const tip = plotEl.querySelector(".tip");
  if (tip) tip.style.opacity = "0";
  if (message) plotEl.insertAdjacentHTML("afterbegin", `<div class="empty">${esc(message)}</div>`);
}

/* ── data ──────────────────────────────────────────────────────────────── */
const ALL_DATES = DATA.dates;
const LAST = ALL_DATES.length - 1;
const OWNERS = DATA.owners || [];
const CATEGORIES = DATA.categoryOrder || [];
const ownerVar = (name) => {
  const i = OWNERS.findIndex((o) => o.name === name);
  return OWNER_VARS[(i < 0 ? 0 : i) % OWNER_VARS.length];
};

// Categories keep their fixed hue where they have one; anything new in the
// spreadsheet takes a remaining slot, so no two categories share a color.
const LIAB_CATS = CATEGORIES.filter((c) => DATA.accounts.some((a) => a.category === c && a.isLiability));
const ASSET_CATS = CATEGORIES.filter((c) => LIAB_CATS.indexOf(c) < 0);
const catVar = {};
{
  const used = {};
  ASSET_CATS.forEach((c) => {
    const v = CATEGORY_VAR_FIXED[c];
    if (v && !used[v]) { catVar[c] = v; used[v] = true; }
  });
  const free = CATEGORY_POOL.filter((v) => !used[v]);
  let k = 0;
  ASSET_CATS.forEach((c) => { if (!catVar[c]) catVar[c] = free[k++ % free.length] || "--c-5"; });
  LIAB_CATS.forEach((c) => { catVar[c] = "--c-8"; });
}

const LIABS_ALL = DATA.accounts.filter((a) => a.isLiability);
DATA.accounts.forEach((a) => {
  a.cssVar = a.isLiability
    ? LIAB_VARS[LIABS_ALL.indexOf(a) % LIAB_VARS.length]
    : (catVar[a.category] || "--c-5");
});
/* A blank cell in the workbook carries the previous balance forward (see
   carry_forward in build_dashboard.py). updatedIdx finds the snapshot a value
   was actually entered on, so a carried balance can say how old it is. */
DATA.accounts.forEach((a) => { a.carriedSet = new Set(a.carried || []); });
function updatedIdx(a, i) {
  let k = i;
  while (k > 0 && a.carriedSet.has(k)) k--;
  return k;
}
// Month and day, plus the year when it isn't the year of the comparison date.
const asOfLabel = (a, i) => {
  const d = ALL_DATES[updatedIdx(a, i)];
  return asDate(d).getFullYear() === asDate(ALL_DATES[i]).getFullYear() ? shortDate(d) : longDate(d);
};
const isStale = (a, i) => !a.closed && a.carriedSet.has(i);

// Liquid assets: anything that could be sold or withdrawn to pay a debt without
// an early-withdrawal penalty or selling a home. Every other asset category —
// cash, bonds, taxable investing, anything custom — counts.
const ILLIQUID_CATS = ["Retirement", "Property"];
const isLiquid = (a) => !a.isLiability && ILLIQUID_CATS.indexOf(a.category) < 0;

/* A "?" that explains a figure on hover or keyboard focus. */
const helpTip = (label, html) =>
  `<span class="help" tabindex="0" role="note" aria-label="${esc(label)}">?<span class="help-tip">${html}</span></span>`;

const ALL_CARDS = LIABS_ALL.length && LIABS_ALL.every((a) => /card/i.test(a.name));
// The chart stacks positive amounts owed; the tile shows the signed balance.
const OWED_LABEL = ALL_CARDS ? "Card balances owed" : "Balances owed";
const LIAB_TILE_LABEL = ALL_CARDS ? "Card balances" : "Liabilities";

const inOwner = (a) => state.owner === "all" || a.owner === state.owner;
/* counted() drives every total: a closed account still holds the balance it had
   before it closed, so hiding it must never change history. listed() drives the
   things you can hide — cards, table columns, change rows, the series picker. */
/* Excluding an account takes it out of counted(), so it leaves every total,
   chart, ratio and the projection at once. Its card stays on the board,
   dimmed, so you can see what's been left out and put it back. */
const isExcluded = (a) => state.excluded.has(a.name);
const counted = () => DATA.accounts.filter((a) => inOwner(a) && !isExcluded(a));
const excludedHere = () => DATA.accounts.filter((a) => inOwner(a) && isExcluded(a));
const withExcluded = () => DATA.accounts.filter(inOwner);
const netAllAt = (i) => sumAt(withExcluded(), i);
// "Mortgage", "Home and Mortgage", or "3 accounts" once a list stops reading well.
const excludedLabel = (list) => list.length <= 2 ? list.map((a) => a.name).join(" and ") : plural(list.length, "account");
const listed = () => counted().filter((a) => state.showClosed || !a.closed);
const countedAssets = () => counted().filter((a) => !a.isLiability);
const countedLiabs = () => counted().filter((a) => a.isLiability);
const sumAt = (list, i) => list.reduce((s, a) => s + a.series[i], 0);
const netAt = (i) => sumAt(counted(), i);
const closedCount = () => counted().filter((a) => a.closed).length;

/* Snap a typed date to the last snapshot on or before it. Values are weekly, so
   a date between snapshots resolves to the previous one — never a future one. */
function snapIdx(iso, fallback) {
  if (!iso) return fallback;
  const t = asDate(iso).getTime();
  let found = -1;
  for (let i = 0; i < ALL_DATES.length; i++) if (asDate(ALL_DATES[i]).getTime() <= t) found = i;
  return found < 0 ? 0 : found;
}

function windowIdx() {
  const all = ALL_DATES.map((_, i) => i);
  if (state.range === "custom") {
    let a = snapIdx(state.from, 0);
    let b = snapIdx(state.to, LAST);
    if (b < a) { const t = a; a = b; b = t; }   // dates entered backwards
    // Always keep at least two snapshots so every delta stays meaningful.
    if (b === a) { if (b > 0) a = b - 1; else b = Math.min(LAST, a + 1); }
    return all.slice(a, b + 1);
  }
  const r = RANGES.filter((x) => x.id === state.range)[0];
  let cutoff = null;
  if (r && r.ytd) cutoff = new Date(asDate(ALL_DATES[LAST]).getFullYear(), 0, 1).getTime();
  else if (r && r.days) cutoff = asDate(ALL_DATES[LAST]).getTime() - r.days * 864e5;
  if (cutoff === null) return all;
  const idx = all.filter((i) => asDate(ALL_DATES[i]).getTime() >= cutoff);
  return idx.length < 2 ? all.slice(-2) : idx;
}

/* ── plottable series ──────────────────────────────────────────────────────
   Keys: "owner:NAME" | "cat:NAME" | "acct:NAME". Net worth is separate — it
   keeps its own color and doesn't use up one of the four pool slots.        */
function membersOf(key) {
  const kind = key.slice(0, key.indexOf(":"));
  const name = key.slice(key.indexOf(":") + 1);
  if (kind === "owner") return counted().filter((a) => a.owner === name);
  if (kind === "cat") return counted().filter((a) => a.category === name);
  return counted().filter((a) => a.name === name && (state.showClosed || !a.closed));
}
function labelOf(key) {
  const kind = key.slice(0, key.indexOf(":"));
  const name = key.slice(key.indexOf(":") + 1);
  return kind === "acct" ? name : name + " total";
}
function plotSeries(idx) {
  const out = [];
  if (state.showNet) out.push({ label: "Net worth", cssVar: "--c-1", raw: idx.map((i) => netAt(i)) });
  // With accounts excluded, the full figure rides along as a dashed reference,
  // so both answers are on the chart. It's a reference, not a series, so it
  // takes no plot slot and wears muted ink rather than a categorical hue.
  const ex = excludedHere();
  if (state.showNet && ex.length) {
    out.push({ label: "Including " + excludedLabel(ex), cssVar: "--text-muted", dash: true, raw: idx.map((i) => netAllAt(i)) });
  }
  state.plotted.forEach((key) => {
    const members = membersOf(key);
    if (!members.length) return;
    out.push({ label: labelOf(key), cssVar: slotOf.get(key), raw: idx.map((i) => sumAt(members, i)) });
  });
  return out;
}

/* ── main time-series chart ────────────────────────────────────────────── */
function renderNetWorth(idx) {
  const plot = document.getElementById("nwPlot");
  const tip = document.getElementById("nwTip");
  const dates = idx.map((i) => ALL_DATES[i]);
  const n = dates.length;
  const pctMode = state.mode === "pct";
  const all = plotSeries(idx);

  document.getElementById("nwTitle").textContent = !state.showNet
    ? "Selected series" : (all.length > 1 ? "Net worth and selected series" : "Net worth over time");

  // In percent mode a series starting at ~$0 has no meaningful base to index to.
  const shown = all.filter((s) => !pctMode || Math.abs(s.raw[0]) >= 1);
  const dropped = all.filter((s) => shown.indexOf(s) < 0).map((s) => s.label);

  document.getElementById("nwLegend").innerHTML = shown.length < 2 ? "" : shown
    .map((s) => `<span class="item"><span class="ln" style="background: ${s.dash
      ? `repeating-linear-gradient(90deg, var(${s.cssVar}) 0 4px, transparent 4px 7px)`
      : `var(${s.cssVar})`}"></span>${esc(s.label)}</span>`).join("");

  if (!shown.length) {
    document.getElementById("nwNote").textContent = dropped.length
      ? dropped.join(", ") + " can't be shown in % mode (starts at $0)."
      : "";
    clearPlot(plot, "Nothing selected — pick a series from Plot series.");
    return;
  }
  shown.forEach((s) => {
    s.vals = pctMode ? s.raw.map((v) => ((v - s.raw[0]) / Math.abs(s.raw[0])) * 100) : s.raw.slice();
  });

  const W = width(plot, 640), H = 268;
  const m = { t: 18, r: 104, b: 30, l: 60 };
  const iw = Math.max(60, W - m.l - m.r), ih = H - m.t - m.b;

  const flat = shown.reduce((acc, s) => acc.concat(s.vals), []);
  const lo = Math.min.apply(null, flat), hi = Math.max.apply(null, flat);
  const padv = Math.max((hi - lo) * 0.16, Math.abs(hi) * 0.004, 0.5);
  const ticks = niceTicks(lo - padv, hi + padv, 4);
  const y0 = Math.min(ticks[0], lo - padv * 0.4), y1 = Math.max(ticks[ticks.length - 1], hi + padv * 0.4);
  const X = (k) => m.l + (n === 1 ? iw / 2 : (k / (n - 1)) * iw);
  const Y = (v) => m.t + ih - ((v - y0) / (y1 - y0)) * ih;
  const fmt = pctMode ? axisPct : axisMoney;

  let s = "";
  ticks.forEach((t) => {
    const zero = Math.abs(t) < 1e-9 && (pctMode || lo < 0);
    s += `<line x1="${m.l}" y1="${Y(t).toFixed(1)}" x2="${m.l + iw}" y2="${Y(t).toFixed(1)}" stroke="var(${zero ? "--axis" : "--grid"})" stroke-width="1"/>`;
    s += `<text class="tick" x="${m.l - 9}" y="${(Y(t) + 3.5).toFixed(1)}" text-anchor="end">${fmt(t)}</text>`;
  });

  // Area wash only for a lone series — under several lines it muddies the plot.
  if (shown.length === 1) {
    const pts = shown[0].vals.map((v, k) => `${X(k).toFixed(1)},${Y(v).toFixed(1)}`);
    s += `<path d="M${m.l},${(m.t + ih).toFixed(1)} L${pts.join(" L")} L${(m.l + iw).toFixed(1)},${(m.t + ih).toFixed(1)} Z" fill="var(${shown[0].cssVar})" fill-opacity="0.1"/>`;
  }
  shown.forEach((sv) => {
    const pts = sv.vals.map((v, k) => `${X(k).toFixed(1)},${Y(v).toFixed(1)}`);
    s += `<path d="M${pts.join(" L")}" fill="none" stroke="var(${sv.cssVar})" stroke-width="${sv.dash ? 1.5 : 2}"${sv.dash ? ` stroke-dasharray="4 3"` : ""} stroke-linejoin="round" stroke-linecap="round"/>`;
  });

  // End markers, then end labels — a label is dropped where it would collide,
  // since the legend and tooltip already carry every value.
  const placed = [];
  shown.forEach((sv) => {
    const y = Y(sv.vals[n - 1]);
    s += `<circle cx="${X(n - 1).toFixed(1)}" cy="${y.toFixed(1)}" r="4.5" fill="var(${sv.cssVar})" stroke="var(--surface-1)" stroke-width="2"/>`;
    if (placed.every((p) => Math.abs(p - y) >= 13)) {
      placed.push(y);
      s += `<text class="mark-label" x="${(X(n - 1) + 10).toFixed(1)}" y="${(y + 4).toFixed(1)}">${pctMode ? pct(sv.vals[n - 1]) : money(sv.vals[n - 1])}</text>`;
    }
  });

  const every = Math.ceil(n / Math.max(2, Math.floor(iw / 62)));
  dates.forEach((d, k) => {
    if (k % every !== 0 && k !== n - 1) return;
    if (k !== n - 1 && n - 1 - k < every * 0.6) return;
    s += `<text class="tick" data-x x="${X(k).toFixed(1)}" y="${(m.t + ih + 19).toFixed(1)}" text-anchor="middle">${shortDate(d)}</text>`;
  });
  s += `<line x1="${m.l}" y1="${(m.t + ih).toFixed(1)}" x2="${m.l + iw}" y2="${(m.t + ih).toFixed(1)}" stroke="var(--axis)" stroke-width="1"/>`;
  s += `<g id="nwHover" opacity="0"><line y1="${m.t}" y2="${m.t + ih}" stroke="var(--axis)" stroke-width="1"/>`
    + shown.map((sv) => `<circle r="5" fill="var(${sv.cssVar})" stroke="var(--surface-1)" stroke-width="2"/>`).join("") + `</g>`;

  clearPlot(plot);
  plot.insertAdjacentHTML("afterbegin",
    `<svg viewBox="0 0 ${W} ${H}" height="${H}" tabindex="0" role="img" aria-label="${esc(shown.map((x) => x.label).join(", "))} from ${longDate(dates[0])} to ${longDate(dates[n - 1])}">${s}</svg>`);

  const svg = plot.querySelector("svg");
  fitAxisLabels(svg, W);
  const hover = svg.querySelector("#nwHover");
  const dots = Array.prototype.slice.call(hover.querySelectorAll("circle"));
  const show = (k) => {
    const cx = X(k);
    hover.setAttribute("opacity", "1");
    hover.querySelector("line").setAttribute("x1", cx);
    hover.querySelector("line").setAttribute("x2", cx);
    dots.forEach((c, j) => { c.setAttribute("cx", cx); c.setAttribute("cy", Y(shown[j].vals[k])); });
    const rows = shown.map((sv) => {
      const main = pctMode ? pct(sv.vals[k]) : money(sv.vals[k]);
      const paren = pctMode ? ` <span class="paren">${money(sv.raw[k])}</span>` : "";
      return `<div class="t-row"><span class="nm"><span class="key" style="background: var(${sv.cssVar})"></span>${esc(sv.label)}</span><span class="vl">${main}${paren}</span></div>`;
    }).join("");
    tip.innerHTML = `<div class="t-date">${longDate(dates[k])}</div>${rows}`;
    const sc = plot.getBoundingClientRect().width / W;
    placeTip(tip, plot, cx * sc, Math.max(0, Y(Math.max.apply(null, shown.map((sv) => sv.vals[k]))) * sc - 12));
  };
  const hide = () => { hover.setAttribute("opacity", "0"); tip.style.opacity = "0"; };
  svg.addEventListener("mousemove", (e) => {
    const r = svg.getBoundingClientRect();
    const x = ((e.clientX - r.left) / r.width) * W;
    let best = 0, bd = Infinity;
    for (let k = 0; k < n; k++) { const d = Math.abs(X(k) - x); if (d < bd) { bd = d; best = k; } }
    show(best);
  });
  svg.addEventListener("mouseleave", hide);
  svg.addEventListener("blur", hide);
  let kb = n - 1;
  svg.addEventListener("focus", () => show(kb));
  svg.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight") kb = Math.min(n - 1, kb + 1);
    else if (e.key === "ArrowLeft") kb = Math.max(0, kb - 1);
    else if (e.key === "Escape") { hide(); return; }
    else return;
    e.preventDefault(); show(kb);
  });

  const d0 = netAt(idx[0]), d1 = netAt(idx[n - 1]);
  let note = `${n} snapshots · ${longDate(dates[0])} → ${longDate(dates[n - 1])} · net worth ${signed(d1 - d0)} (${pct(d0 ? ((d1 - d0) / Math.abs(d0)) * 100 : 0)})`;
  if (pctMode) note += " · % is change since the start of the range";
  if (dropped.length) note += ` · ${dropped.join(", ")} hidden in % mode (starts at $0)`;
  document.getElementById("nwNote").textContent = note;
}

/* ── stacked columns (assets, liabilities) ─────────────────────────────── */
function stackedColumns(opts) {
  const { plotId, tipId, idx, series, height, valueOf, totalLabel } = opts;
  const plot = document.getElementById(plotId);
  const tip = document.getElementById(tipId);
  const dates = idx.map((i) => ALL_DATES[i]);
  const n = dates.length;

  const pctMode = state.mode === "pct";
  const cash = idx.map((i) => series.map((s) => Math.max(0, valueOf(s, i))));
  const cashTotals = cash.map((col) => col.reduce((a, b) => a + b, 0));
  if (!series.length || Math.max.apply(null, cashTotals) <= 0) { clearPlot(plot, "Nothing to show for this filter."); return; }

  // In percent mode every column fills the plot and segments carry their share.
  const stacks = pctMode
    ? cash.map((col, k) => col.map((v) => (cashTotals[k] ? (v / cashTotals[k]) * 100 : 0)))
    : cash;
  const totals = pctMode ? cashTotals.map((t) => (t ? 100 : 0)) : cashTotals;

  const W = width(plot, 560), H = height;
  const m = { t: 16, r: 12, b: 30, l: 58 };
  const iw = Math.max(60, W - m.l - m.r), ih = H - m.t - m.b;

  // Domain top comes from the data, not from the last tick — a tick run can end
  // below the max, which would draw columns above the plot area.
  const y1 = pctMode ? 100 : Math.max.apply(null, totals) * 1.06;
  const ticks = pctMode ? [0, 25, 50, 75, 100] : niceTicks(0, y1, 4);
  const axisFmt = pctMode ? axisPct : axisMoney;
  const share = (v) => (Math.round(v * 10) / 10) + "%";
  const Y = (v) => m.t + ih - (v / y1) * ih;
  const band = iw / n;
  const bw = Math.min(24, band * 0.66);
  const X = (k) => m.l + band * k + (band - bw) / 2;
  const GAP = 2;

  let s = "";
  ticks.forEach((t) => {
    s += `<line x1="${m.l}" y1="${Y(t).toFixed(1)}" x2="${m.l + iw}" y2="${Y(t).toFixed(1)}" stroke="var(--grid)" stroke-width="1"/>`;
    s += `<text class="tick" x="${m.l - 9}" y="${(Y(t) + 3.5).toFixed(1)}" text-anchor="end">${axisFmt(t)}</text>`;
  });

  stacks.forEach((col, k) => {
    let acc = 0;
    const topSeg = col.reduce((best, v, j) => (v > 0 ? j : best), -1);
    col.forEach((v, j) => {
      if (v <= 0) return;
      const yTop = Y(acc + v), yBot = Y(acc);
      const isTop = j === topSeg;
      const h = Math.max(1, yBot - yTop - (isTop ? 0 : GAP));
      const d = isTop ? topRoundedRect(X(k), yTop, bw, h, 4) : `M${X(k)},${yTop} h${bw} v${h} h${-bw} Z`;
      s += `<path d="${d}" fill="var(${series[j].cssVar})"/>`;
      acc += v;
    });
  });

  const every = Math.ceil(n / Math.max(2, Math.floor(iw / 56)));
  dates.forEach((d, k) => {
    if (k % every !== 0 && k !== n - 1) return;
    if (k !== n - 1 && n - 1 - k < every * 0.6) return;
    s += `<text class="tick" data-x x="${(X(k) + bw / 2).toFixed(1)}" y="${(m.t + ih + 19).toFixed(1)}" text-anchor="middle">${shortDate(d)}</text>`;
  });
  s += `<line x1="${m.l}" y1="${(m.t + ih).toFixed(1)}" x2="${m.l + iw}" y2="${(m.t + ih).toFixed(1)}" stroke="var(--axis)" stroke-width="1"/>`;
  s += `<g id="hl-${plotId}" opacity="0"><rect y="${m.t}" height="${ih}" fill="var(--ghost)" rx="4"/></g>`;

  clearPlot(plot);
  plot.insertAdjacentHTML("afterbegin",
    `<svg viewBox="0 0 ${W} ${H}" height="${H}" tabindex="0" role="img" aria-label="${esc(totalLabel)} by snapshot, ${longDate(dates[0])} to ${longDate(dates[n - 1])}. Latest ${money(cashTotals[n - 1])}.">${s}</svg>`);

  const svg = plot.querySelector("svg");
  fitAxisLabels(svg, W);
  const hl = svg.querySelector(`#hl-${plotId}`);
  const show = (k) => {
    hl.setAttribute("opacity", "1");
    const r = hl.querySelector("rect");
    r.setAttribute("x", m.l + band * k + 1);
    r.setAttribute("width", Math.max(4, band - 2));
    let rows = "";
    series.forEach((sv, j) => {
      if (stacks[k][j] <= 0) return;
      const val = pctMode
        ? `${share(stacks[k][j])} <span class="paren">${money(cash[k][j])}</span>`
        : money(cash[k][j]);
      rows += `<div class="t-row"><span class="nm"><span style="width:9px;height:9px;border-radius:3px;background:var(${sv.cssVar});display:inline-block"></span>${esc(sv.label)}</span><span class="vl">${val}</span></div>`;
    });
    tip.innerHTML = `<div class="t-date">${longDate(dates[k])}</div>${rows}<div class="t-sep"></div>`
      + `<div class="t-row"><span class="nm">${esc(totalLabel)}</span><span class="vl">${money(cashTotals[k])}</span></div>`;
    const sc = plot.getBoundingClientRect().width / W;
    placeTip(tip, plot, (m.l + band * k + band / 2) * sc, Math.max(0, Y(totals[k]) * sc - 20));
  };
  const hide = () => { hl.setAttribute("opacity", "0"); tip.style.opacity = "0"; };
  svg.addEventListener("mousemove", (e) => {
    const r = svg.getBoundingClientRect();
    const x = ((e.clientX - r.left) / r.width) * W;
    show(Math.max(0, Math.min(n - 1, Math.floor((x - m.l) / band))));
  });
  svg.addEventListener("mouseleave", hide);
  svg.addEventListener("blur", hide);
  let kb = n - 1;
  svg.addEventListener("focus", () => show(kb));
  svg.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight") kb = Math.min(n - 1, kb + 1);
    else if (e.key === "ArrowLeft") kb = Math.max(0, kb - 1);
    else if (e.key === "Escape") { hide(); return; }
    else return;
    e.preventDefault(); show(kb);
  });
}

function renderAssets(idx) {
  const assets = countedAssets();
  const series = ASSET_CATS
    .filter((c) => assets.some((a) => a.category === c))
    .map((c) => ({ label: c, cssVar: catVar[c], members: assets.filter((a) => a.category === c) }));
  document.getElementById("assetLegend").innerHTML = series.length < 2 ? "" : series
    .map((s) => `<span class="item"><span class="sw" style="background: var(${s.cssVar})"></span>${esc(s.label)}</span>`).join("");
  document.getElementById("assetNote").textContent = state.mode === "pct"
    ? "Each column is one snapshot. Segments show each category's share of total assets; liabilities are excluded."
    : "Each column is one snapshot. Segments stack to total assets; liabilities are excluded.";
  stackedColumns({
    plotId: "assetPlot", tipId: "assetTip", idx, series, height: 300,
    valueOf: (s, i) => s.members.reduce((t, a) => t + a.series[i], 0),
    totalLabel: "Total assets",
  });
}

function renderLiabilities(idx) {
  const series = countedLiabs().map((a) => ({ label: a.name, cssVar: a.cssVar, acct: a }));
  document.getElementById("liabTitle").textContent = OWED_LABEL;
  document.getElementById("liabNote").textContent = state.mode === "pct"
    ? "Each segment is its share of everything owed that week."
    : "Shown as positive amounts owed. Lower is better.";
  document.getElementById("liabLegend").innerHTML = series.length < 2 ? "" : series
    .map((s) => `<span class="item"><span class="sw" style="background: var(${s.cssVar})"></span>${esc(s.label)}</span>`).join("");
  stackedColumns({
    plotId: "liabPlot", tipId: "liabTip", idx, series, height: 262,
    valueOf: (s, i) => -s.acct.series[i],
    totalLabel: "Total owed",
  });
}

function renderChange(idx) {
  const plot = document.getElementById("changePlot");
  const a0 = idx[0], a1 = idx[idx.length - 1];
  const pctMode = state.mode === "pct";
  // Percent is each account's own change, so an account starting at $0 has none.
  const all = listed().map((a) => {
    const base = a.series[a0], delta = a.series[a1] - base;
    return { name: a.name, owner: a.owner, money: delta, pct: Math.abs(base) >= 1 ? (delta / Math.abs(base)) * 100 : null };
  });
  const rows = all.filter((r) => !pctMode || r.pct !== null)
    .map((r) => ({ name: r.name, owner: r.owner, delta: pctMode ? r.pct : r.money, money: r.money, pct: r.pct }))
    .sort((x, y) => y.delta - x.delta);
  const noBase = all.filter((r) => pctMode && r.pct === null).map((r) => r.name);
  const hiddenMoved = counted().filter((a) => a.closed && !state.showClosed && Math.abs(a.series[a1] - a.series[a0]) > 0.005).length;
  document.getElementById("changeNote").textContent =
    (pctMode
      ? `Each account's own change, ${longDate(ALL_DATES[a0])} → ${longDate(ALL_DATES[a1])}. Paying down a card counts as an increase.`
      : `Contribution to net worth, ${longDate(ALL_DATES[a0])} → ${longDate(ALL_DATES[a1])}. Paying down a card counts as an increase.`)
    + (noBase.length ? ` ${noBase.join(", ")} started at $0, so ${noBase.length === 1 ? "it has" : "they have"} no percentage.` : "")
    + (hiddenMoved ? ` ${plural(hiddenMoved, "closed account")} changed in this range and ${hiddenMoved === 1 ? "is" : "are"} hidden.` : "");
  // Owner key — only for owners who actually have a row, and only when the
  // chart mixes owners (filtered to one person, every dot would match).
  const ownersShown = OWNERS.filter((o) => rows.some((r) => r.owner === o.name));
  const byOwner = ownersShown.length > 1;
  document.getElementById("changeOwners").innerHTML = byOwner
    ? `<span class="item" style="color: var(--text-muted)">Account owner:</span>` + ownersShown.map((o) =>
        `<span class="item"><span class="sw" style="border-radius:999px; background: var(${ownerVar(o.name)})"></span>${esc(o.name)}</span>`).join("")
    : "";
  if (!rows.length) { clearPlot(plot, "Nothing to show for this filter."); return; }

  const rowH = 26, W = width(plot, 520);
  const m = { t: 10, r: 92, b: 26, l: 148 };
  const ih = rows.length * rowH, H = m.t + ih + m.b;
  const iw = Math.max(60, W - m.l - m.r);
  const maxAbs = Math.max(1, Math.max.apply(null, rows.map((r) => Math.abs(r.delta))));
  const X = (v) => m.l + iw / 2 + (v / maxAbs) * (iw / 2);
  const bh = Math.min(16, rowH - 8);

  const axisFmt = pctMode ? axisPct : axisMoney;
  const allTicks = [-maxAbs, -maxAbs / 2, 0, maxAbs / 2, maxAbs];
  const tickRoom = allTicks.reduce((sum, t) => sum + axisFmt(t).length * 6.1, 0);
  const ticks = tickRoom > iw * 0.95 ? [-maxAbs, 0, maxAbs] : allTicks;
  let s = "";
  ticks.forEach((t) => {
    const isZero = Math.abs(t) < 1e-9;
    s += `<line x1="${X(t).toFixed(1)}" y1="${m.t}" x2="${X(t).toFixed(1)}" y2="${m.t + ih}" stroke="var(${isZero ? "--axis" : "--grid"})" stroke-width="1"/>`;
    s += `<text class="tick" x="${X(t).toFixed(1)}" y="${(m.t + ih + 17).toFixed(1)}" text-anchor="middle">${isZero ? "0" : axisFmt(t)}</text>`;
  });
  const CH = 6.2;                                     // ≈ width of one digit at 11.5px
  const DOT = byOwner ? 12 : 0;                       // room for the owner dot
  const fitName = (name) => {
    const room = m.l - 16 - DOT;
    if (name.length * 5.9 <= room) return name;
    return name.slice(0, Math.max(3, Math.floor(room / 5.9) - 1)) + "…";
  };
  rows.forEach((r, k) => {
    const y = m.t + k * rowH + (rowH - bh) / 2;
    const baseY = (y + bh / 2 + 4).toFixed(1);
    const pos = r.delta >= 0;
    if (Math.abs(r.delta) > 0.005) {
      s += `<path d="${endRoundedRectH(X(0), X(r.delta), y, bh, 4)}" fill="var(${pos ? "--c-1" : "--c-8"})"/>`;
    }
    s += `<text class="tick" x="${m.l - 10 - DOT}" y="${baseY}" text-anchor="end" style="font-size:11.5px; fill: var(--text-secondary)">${esc(fitName(r.name))}${r.owner ? `<title>${esc(r.name)} · ${esc(r.owner)}</title>` : ""}</text>`;
    if (byOwner && r.owner) {
      s += `<circle cx="${m.l - 14}" cy="${(y + bh / 2).toFixed(1)}" r="4" fill="var(${ownerVar(r.owner)})"><title>${esc(r.owner)}</title></circle>`;
    }

    // Value rides outside the bar end where there's room; a bar that runs to the
    // edge takes its label inside instead, so it never lands on the name column.
    const text = pctMode ? pct(r.delta) : signed(r.delta);
    const tw = text.length * CH;
    const outside = pos ? X(r.delta) + 7 : X(r.delta) - 7;
    const fitsOutside = pos ? outside + tw <= W - 2 : outside - tw >= m.l + 2;
    const barLen = Math.abs(X(r.delta) - X(0));
    if (fitsOutside) {
      s += `<text class="tick" x="${outside.toFixed(1)}" y="${baseY}" text-anchor="${pos ? "start" : "end"}" style="font-size:11.5px; fill: var(--text-secondary)">${text}</text>`;
    } else if (barLen >= tw + 14) {
      const inside = pos ? X(r.delta) - 7 : X(r.delta) + 7;
      s += `<text x="${inside.toFixed(1)}" y="${baseY}" text-anchor="${pos ? "end" : "start"}" style="font-size:11.5px; font-weight:600; fill: var(--surface-1)">${text}</text>`;
    }
  });

  clearPlot(plot);
  plot.insertAdjacentHTML("afterbegin",
    `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Change in each account between ${longDate(ALL_DATES[a0])} and ${longDate(ALL_DATES[a1])}">${s}</svg>`);
}

/* ── board ─────────────────────────────────────────────────────────────── */
function sparkline(vals, cssVar) {
  const W = 200, H = 34, p = 4;
  const lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
  const span = hi - lo || 1;
  const X = (k) => (vals.length === 1 ? W / 2 : p + (k / (vals.length - 1)) * (W - 2 * p));
  const Y = (v) => H - p - ((v - lo) / span) * (H - 2 * p);
  const pts = vals.map((v, k) => `${X(k).toFixed(1)},${Y(v).toFixed(1)}`).join(" L");
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-hidden="true">`
    + `<path d="M${pts}" fill="none" stroke="var(--spark)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>`
    + `<circle cx="${X(vals.length - 1).toFixed(1)}" cy="${Y(vals[vals.length - 1]).toFixed(1)}" r="3.2" fill="var(${cssVar})" stroke="var(--surface-1)" stroke-width="2" vector-effect="non-scaling-stroke"/>`
    + `</svg>`;
}

function renderBoard(idx) {
  const a0 = idx[0], a1 = idx[idx.length - 1];
  const list = listed();
  const assetsTotal = sumAt(countedAssets(), a1) || 1;
  let html = "";

  const owedTotal = Math.abs(sumAt(countedLiabs(), a1));
  const liquidList = countedAssets().filter(isLiquid);
  const liquidTotal = sumAt(liquidList, a1);
  const liquidCats = ASSET_CATS.filter((c) => liquidList.some((a) => a.category === c));
  const illiquidCats = ASSET_CATS.filter((c) => ILLIQUID_CATS.indexOf(c) >= 0 && counted().some((a) => a.category === c));

  const shownExcl = excludedHere().filter((a) => state.showClosed || !a.closed);
  const onBoard = list.concat(shownExcl);
  CATEGORIES.filter((c) => onBoard.some((a) => a.category === c)).forEach((c) => {
    const members = onBoard.filter((a) => a.category === c).slice().sort((x, y) =>
      (isExcluded(x) - isExcluded(y)) || Math.abs(y.series[a1]) - Math.abs(x.series[a1]));
    const isLiabCat = LIAB_CATS.indexOf(c) >= 0;
    // Totals count every account in the category, including any hidden closed
    // ones — otherwise the shares wouldn't add up to 100%.
    const inCat = counted().filter((a) => a.category === c);
    const cTotal = sumAt(inCat, a1), cThen = sumAt(inCat, a0);
    const cDelta = cTotal - cThen;
    const cPct = Math.abs(cThen) >= 1 ? (cDelta / Math.abs(cThen)) * 100 : null;
    // For a liability category the ratio is debt against assets — a different
    // quantity from an asset category's share, so it gets its own wording.
    const owed = Math.abs(cTotal);
    const ratio = isLiabCat
      ? `${((owed / assetsTotal) * 100).toFixed(1)}% debt-to-assets`
        + helpTip("What is debt-to-assets?",
            `<b>Debt-to-assets</b> — ${money(owed)} owed ÷ ${money(assetsTotal)}, everything you own `
            + `(including retirement and property). The share of your assets the debt would claim if you `
            + `cashed out everything.`)
        + ` · ` + (liquidTotal > 0 ? `${((owed / liquidTotal) * 100).toFixed(1)}% debt-to-liquid` : `no liquid assets`)
        + helpTip("What is debt-to-liquid?",
            `<b>Debt-to-liquid</b> — ${money(owed)} owed ÷ ${money(Math.max(0, liquidTotal))} of liquid assets: `
            + `${liquidCats.length ? esc(liquidCats.join(", ")) : "none right now"}. That's what you could use to pay the debt `
            + `without early-withdrawal penalties or selling property`
            + (illiquidCats.length ? ` — ${esc(illiquidCats.join(" and "))} ${illiquidCats.length === 1 ? "is" : "are"} left out` : "")
            + `. Under 100% means you could clear it today.`)
      : `${((cTotal / assetsTotal) * 100).toFixed(1)}% of assets`;
    html += `<div class="board-group"><div class="board-head">`
      + `<span class="nm"><span class="dot" style="background: var(${catVar[c]})"></span>${esc(c)}</span>`
      + (inCat.length
          ? `<span class="tot"><span class="amt${cTotal < 0 ? " owed" : ""}">${money(cTotal)}</span>`
            + ` · <span class="${dirClass(cDelta)}">${arrow(cDelta)} ${bothWays(cDelta, cPct, state.mode === "pct")}</span>`
            + ` · ${ratio}</span>`
          : `<span class="tot">excluded from totals</span>`)
      + `</div><div class="cards">`;

    members.forEach((a) => {
      const key = "acct:" + a.name;
      const v = a.series[a1], d = v - a.series[a0];
      const dPct = Math.abs(a.series[a0]) >= 1 ? (d / Math.abs(a.series[a0])) * 100 : null;
      const on = state.plotted.indexOf(key) >= 0;
      const full = state.plotted.length >= MAX_PLOT && !on;
      // Each card shows its share of the group it belongs to, so the cards in a
      // section add to 100%. A liability's group is everything owed, not assets.
      const shareTxt = isLiabCat
        ? `${owedTotal ? ((Math.abs(v) / owedTotal) * 100).toFixed(1) : "0.0"}% of total owed`
        : `${((v / assetsTotal) * 100).toFixed(1)}% of assets`;
      const excl = isExcluded(a);
      html += `<div class="card acct${a.closed ? " is-closed" : ""}${excl ? " is-excluded" : ""}">`
        + `<div class="top"><span class="nm">${esc(a.name)}</span>`
        + (excl ? `<span class="chip excl" title="Left out of every total — use Exclude to change">Excluded</span>` : "")
        + (a.closed
            ? `<span class="chip closed" title="No balance since ${a.lastHeld ? longDate(a.lastHeld) : "—"}">Closed</span>`
            : (a.owner ? `<span class="chip" style="--own: var(${ownerVar(a.owner)})"><span class="dot"></span>${esc(a.owner)}</span>` : ""))
        + `</div>`
        + `<div class="value${v < 0 ? " owed" : ""}">${money(v)}</div>`
        // Account cards always carry both figures, whatever the $/% switch says.
        + `<div class="meta"><span class="${dirClass(d)}">${arrow(d)} ${bothWays(d, dPct, false)}</span>`
        + `<span class="share">${excl ? "not in totals" : a.closed && a.lastHeld ? "last held " + shortDate(a.lastHeld) : shareTxt}</span></div>`
        + (isStale(a, a1)
            ? `<div class="asof" title="Not updated on ${longDate(ALL_DATES[a1])} — showing the balance entered on ${longDate(ALL_DATES[updatedIdx(a, a1)])}">Updated ${asOfLabel(a, a1)}</div>`
            : "")
        + sparkline(idx.map((i) => a.series[i]), a.cssVar)
        + (excl
            ? `<button type="button" class="plotbtn incl" data-include="${esc(a.name)}" title="Count this account in every total again">Include</button>`
            : `<button type="button" class="plotbtn" data-plot="${esc(key)}" aria-pressed="${on}"${full ? " disabled" : ""}`
              + ` title="${on ? "Remove from the chart" : "Plot this account on the chart"}">${on ? "Plotted" : "Plot"}</button>`)
        + `</div>`;
    });
    html += `</div></div>`;
  });

  document.getElementById("board").innerHTML = html || `<div class="empty">No accounts match this filter.</div>`;
  document.getElementById("boardNote").textContent =
    `${plural(list.length, "account")}${shownExcl.length ? ` (+${shownExcl.length} excluded)` : ""} · values as of ${longDate(ALL_DATES[a1])} · change and sparkline over the selected range · hover a card to plot it on the chart`
    + (list.some((a) => isStale(a, a1)) ? ` · "Updated" marks a balance not entered on that date, carried forward from its last entry` : "");
}

/* ── tiles ─────────────────────────────────────────────────────────────── */
function renderTiles(idx) {
  const a0 = idx[0], a1 = idx[idx.length - 1];
  const net = netAt(a1), net0 = netAt(a0), dNet = net - net0;

  const ex = excludedHere();
  document.getElementById("heroLabel").textContent =
    (state.owner === "all" ? "Net worth" : `Net worth · ${state.owner}`)
    + (ex.length ? ` · excluding ${excludedLabel(ex)}` : "");
  const incl = document.getElementById("heroIncl");
  incl.hidden = !ex.length;
  if (ex.length) {
    const full = netAllAt(a1);
    incl.innerHTML = `Including ${esc(excludedLabel(ex))}: <b class="${full < 0 ? "down" : ""}">${money(full)}</b>`;
  }
  const pctMode = state.mode === "pct";
  const netPct = net0 ? (dNet / Math.abs(net0)) * 100 : null;
  document.getElementById("heroValue").textContent = money(net);
  document.getElementById("heroDelta").innerHTML =
    `<span class="${dirClass(dNet)}">${arrow(dNet)} ${bothWays(dNet, netPct, pctMode)}</span>`
    + ` <span class="sub2">since ${longDate(ALL_DATES[a0])}</span>`;

  const prev = idx.length > 1 ? netAt(idx[idx.length - 2]) : net;
  const wk = net - prev;
  const days = (asDate(ALL_DATES[a1]) - asDate(ALL_DATES[a0])) / 864e5;
  const perWeek = days > 0 ? (dNet / days) * 7 : 0;
  const perWeekPct = days > 0 && netPct !== null ? (netPct / days) * 7 : null;
  document.getElementById("heroTiles").innerHTML = [
    { label: "Since last snapshot", value: bothWays(wk, prev ? (wk / Math.abs(prev)) * 100 : null, pctMode), cls: dirClass(wk) },
    { label: "Average per week", value: bothWays(perWeek, perWeekPct, pctMode), cls: dirClass(perWeek) },
  ].map((t) => `<div><div class="label">${t.label}</div><div class="value ${t.cls}" style="font-size:18px">${t.value}</div></div>`).join("");

  const catSum = (c, i) => counted().filter((a) => a.category === c).reduce((t, a) => t + a.series[i], 0);
  const tiles = [{ label: "Total assets", now: sumAt(countedAssets(), a1), then: sumAt(countedAssets(), a0), good: 1 }];
  ASSET_CATS.filter((c) => counted().some((a) => a.category === c))
    .forEach((c) => tiles.push({ label: c, now: catSum(c, a1), then: catSum(c, a0), good: 1 }));
  if (countedLiabs().length) {
    // Signed, so it reads as what it takes off net worth. Paying a card down
    // moves the balance toward zero, which is still an increase — good = 1.
    tiles.push({ label: LIAB_TILE_LABEL, now: sumAt(countedLiabs(), a1), then: sumAt(countedLiabs(), a0), good: 1 });
  }

  document.getElementById("tiles").innerHTML = tiles.map((t) => {
    const d = t.now - t.then;
    const cls = d === 0 ? "flat" : (d > 0) === (t.good > 0) ? "up" : "down";
    const p = Math.abs(t.then) >= 1 ? (d / Math.abs(t.then)) * 100 : null;
    return `<div class="card tile"><div class="label">${esc(t.label)}</div>`
      + `<div class="value${t.now < 0 ? " owed" : ""}">${money(t.now)}</div>`
      // No "since …" here — the hero above states the range once, for all of them.
      + `<div class="delta ${cls}">${arrow(d)} ${bothWays(d, p, pctMode)}</div></div>`;
  }).join("");
}

function renderTable(idx) {
  const list = listed();
  const hidden = counted().length - list.length;
  const anyCarried = list.some((a) => idx.some((i) => a.carriedSet.has(i)));
  document.getElementById("tableNote").textContent =
    "Every value in the workbook for the current filters. Δ is the change in net worth from the previous snapshot."
    + (anyCarried ? " Grey italic values were left blank that week and carry the previous entry forward." : "")
    + (hidden ? ` ${plural(hidden, "closed account")} not shown as a column, but still counted in net worth.` : "")
    + (excludedHere().length ? ` Excluding ${excludedLabel(excludedHere())} — not shown or counted.` : "");
  const head = `<tr><th>Date</th>${list.map((a) => `<th>${esc(a.name)}</th>`).join("")}<th>Net worth</th><th>Δ</th></tr>`;
  const body = idx.map((i, k) => {
    const net = netAt(i);
    const d = k > 0 ? net - netAt(idx[k - 1]) : null;
    return `<tr><td>${longDate(ALL_DATES[i])}</td>`
      + list.map((a) => (a.carriedSet.has(i)
          ? `<td class="carried" title="Blank in the workbook — carried forward from ${longDate(ALL_DATES[updatedIdx(a, i)])}">${money(a.series[i])}</td>`
          : `<td>${money(a.series[i])}</td>`)).join("")
      + `<td style="font-weight:600">${money(net)}</td>`
      + `<td class="${d === null ? "flat" : dirClass(d)}">${d === null ? "–" : signed(d)}</td></tr>`;
  }).join("");
  document.getElementById("tableWrap").innerHTML = `<table><thead>${head}</thead><tbody>${body}</tbody></table>`;
}

/* ── series picker ─────────────────────────────────────────────────────── */
function renderPlotMenu(idx) {
  const a1 = idx[idx.length - 1];
  const list = listed();
  const row = (key, label, value, forced) => {
    const on = forced !== undefined ? forced : state.plotted.indexOf(key) >= 0;
    const full = forced === undefined && state.plotted.length >= MAX_PLOT && !on;
    const swatch = key === "net" ? "--c-1" : (on ? slotOf.get(key) : null);
    return `<label class="${full ? "off" : ""}"><input type="checkbox" data-key="${esc(key)}"${on ? " checked" : ""}${full ? " disabled" : ""}>`
      + `<span class="key"${swatch ? ` style="background: var(${swatch})"` : ""}></span>`
      + `<span class="nm">${esc(label)}</span><span class="vl">${money(value)}</span></label>`;
  };

  let html = `<div class="grp">Totals</div>` + row("net", "Net worth", netAt(a1), state.showNet);

  // Per-owner totals only make sense when more than one owner is in play.
  const ownersHere = OWNERS.filter((o) => counted().some((a) => a.owner === o.name));
  if (state.owner === "all" && ownersHere.length > 1) {
    html += `<div class="grp">By owner</div>`;
    ownersHere.forEach((o) => {
      html += row("owner:" + o.name, o.name, sumAt(counted().filter((a) => a.owner === o.name), a1));
    });
  }

  const catsHere = CATEGORIES.filter((c) => counted().some((a) => a.category === c));
  if (catsHere.length > 1) {
    html += `<div class="grp">By category</div>`;
    catsHere.forEach((c) => {
      html += row("cat:" + c, c, sumAt(counted().filter((a) => a.category === c), a1));
    });
  }

  catsHere.filter((c) => list.some((a) => a.category === c)).forEach((c) => {
    html += `<div class="grp">${esc(c)}</div>`;
    list.filter((a) => a.category === c).forEach((a) => {
      html += row("acct:" + a.name, a.name, a.series[a1]);
    });
  });

  html += `<div class="hint">Net worth has its own color. Up to ${MAX_PLOT} other series at a time — past that, lines stop being reliably distinguishable.</div>`;
  document.getElementById("plotMenu").innerHTML = html;
  document.getElementById("plotSummary").textContent =
    state.plotted.length ? `Plotting ${state.plotted.length} of ${MAX_PLOT}` : "Plot series";
}

function toggleSeries(key) {
  if (key === "net") { state.showNet = !state.showNet; renderAll(); return; }
  const i = state.plotted.indexOf(key);
  if (i >= 0) {
    state.plotted.splice(i, 1);
    slotOf.delete(key);          // frees the hue; series still plotted keep theirs
  } else {
    if (state.plotted.length >= MAX_PLOT) return;
    const used = {};
    state.plotted.forEach((k) => { used[slotOf.get(k)] = true; });
    slotOf.set(key, PLOT_POOL.filter((v) => !used[v])[0]);
    state.plotted.push(key);
  }
  renderAll();
}

/* ── projection ────────────────────────────────────────────────────────────
   The groups below compound at their own rate with a monthly contribution;
   every other balance (cash, property, custom categories, debt) is held at its
   latest value. Returns are shared across owner views — they describe the
   market — while group contributions are kept per owner view, since
   "Everyone" isn't necessarily the sum of what each person typed.

   Any group can switch to per-account settings instead. Those values belong
   to the account, not the owner view: an account has one owner, so it
   contributes the same whether you're looking at Everyone or just them.    */
const PROJ_GROUPS = [
  { cat: "Taxable investing", label: "Investments", ret: 7 },
  { cat: "Retirement", label: "Retirement", ret: 7 },
  { cat: "Bonds", label: "Bonds", ret: 4 },
];
const PROJ_KEY = "nw-projection";
const projVar = (cat) => catVar[cat] || CATEGORY_VAR_FIXED[cat] || "--c-5";
const proj = (() => {
  const base = { years: 30, inflation: 3, real: false, raiseOn: false, raisePct: 3, returns: {}, monthly: {}, advanced: {}, acctReturns: {}, acctMonthly: {}, loans: {}, appreciation: {} };
  try {
    const saved = JSON.parse(localStorage.getItem(PROJ_KEY));
    if (saved && typeof saved === "object") Object.assign(base, saved);
  } catch (e) { /* storage blocked or corrupt — fall back to defaults */ }
  ["returns", "monthly", "advanced", "acctReturns", "acctMonthly", "loans", "appreciation"].forEach((k) => {
    if (!base[k] || typeof base[k] !== "object") base[k] = {};
  });
  PROJ_GROUPS.forEach((g) => { if (!isFinite(base.returns[g.cat])) base.returns[g.cat] = g.ret; });
  return base;
})();
function saveProj() {
  try { localStorage.setItem(PROJ_KEY, JSON.stringify(proj)); } catch (e) { /* not persisted; still works */ }
}
const clampNum = (v, lo, hi, fallback) => {
  const x = parseFloat(v);
  return isFinite(x) ? Math.min(hi, Math.max(lo, x)) : fallback;
};
function monthlyFor(cat) {
  const scope = proj.monthly[state.owner] || {};
  return isFinite(scope[cat]) ? scope[cat] : 0;
}
// Closed accounts hold nothing at the latest snapshot, so there's nothing to set.
const projAccounts = (cat) => counted().filter((a) => a.category === cat && !a.closed);
const acctReturn = (a) => (isFinite(proj.acctReturns[a.name]) ? proj.acctReturns[a.name] : proj.returns[a.category]);
const acctMonthly = (a) => (isFinite(proj.acctMonthly[a.name]) ? proj.acctMonthly[a.name] : 0);

/* ── loans & property ──────────────────────────────────────────────────────
   A fixed-rate loan's future depends only on today's balance, the rate and
   the payment — so the balance from the sheet is the starting point and no
   original loan amount is needed, wherever you are in the loan. Interest is
   the annual rate / 12 on the balance each month (how US mortgages accrue);
   the payment is principal + interest only, since escrow never touches the
   balance. Credit cards have no schedule, so they aren't offered.          */
const LOAN_DEFAULT = { on: false, rate: null, mode: "payment", payment: null, years: null, extra: 0, invest: false, target: "grp:Taxable investing" };
const loanOf = (name) => Object.assign({}, LOAN_DEFAULT, proj.loans[name] || {});
const setLoan = (name, patch) => { proj.loans[name] = Object.assign(loanOf(name), patch); };
const loanAccounts = () => counted().filter((a) => a.isLiability && !a.closed && !/card/i.test(a.name) && a.series[LAST] < -CENT);
const propertyAccounts = () => counted().filter((a) => a.category === "Property" && !a.isLiability && !a.closed);
const appreciationOf = (a) => (isFinite(proj.appreciation[a.name]) ? proj.appreciation[a.name] : 0);

/* The regular monthly payment: as typed, or — from years left — the payment
   that clears the balance in exactly that many months. */
function loanPayment(loan, owed) {
  if (!isFinite(loan.rate) || loan.rate < 0) return null;
  if (loan.mode === "years") {
    const n = Math.round(loan.years * 12);
    if (!(n > 0)) return null;
    const i = loan.rate / 1200;
    return i ? (owed * i) / (1 - Math.pow(1 + i, -n)) : owed / n;
  }
  return loan.payment > 0 ? loan.payment : null;
}
// Months to payoff and the interest paid getting there, or null if the payment
// never outruns the interest.
function loanSchedule(owed, rate, pay) {
  const i = rate / 1200;
  if (pay <= owed * i + 1e-9) return null;
  let m = 0, interest = 0;
  while (owed > CENT && m < 1200) {
    const int = owed * i;
    interest += int;
    owed = owed + int - Math.min(pay, owed + int);
    m++;
  }
  return { months: m, interest };
}
const yearsMonths = (months) => {
  const y = Math.floor(months / 12), mo = months % 12;
  return [y ? plural(y, "yr") : "", mo ? mo + " mo" : ""].filter(Boolean).join(" ") || "0 mo";
};
const monthAfter = (months) => {
  const d = asDate(ALL_DATES[LAST]);
  return new Date(d.getFullYear(), d.getMonth() + months, 1).toLocaleDateString("en-US", { month: "short", year: "numeric" });
};
function loanSummary(a) {
  const loan = loanOf(a.name), owed = -a.series[LAST];
  const base = loanPayment(loan, owed);
  if (base === null) {
    return { warn: false, text: loan.mode === "years"
      ? "Enter the interest rate and the years left to model this loan. Until then it's held at today's balance."
      : "Enter the interest rate and your monthly payment (principal + interest) to model this loan. Until then it's held at today's balance." };
  }
  const extra = loan.extra > 0 ? loan.extra : 0;
  const sched = loanSchedule(owed, loan.rate, base + extra);
  if (!sched) {
    return { warn: true, text: `At ${money(base + extra)}/mo the balance never falls: a month's interest is ${money(owed * loan.rate / 1200)}. Check the rate, or that the payment is principal + interest.` };
  }
  let text = (loan.mode === "years" ? `Payment ${money(base)}/mo (principal + interest). ` : "")
    + `Paid off ${monthAfter(sched.months)} (${yearsMonths(sched.months)}) · ${money(sched.interest)} interest left to pay`;
  if (extra) {
    const plain = loanSchedule(owed, loan.rate, base);
    if (plain) text += ` · the extra ${money(extra)}/mo saves ${yearsMonths(plain.months - sched.months)} and ${money(plain.interest - sched.interest)} in interest`;
    else text += ` · without the extra ${money(extra)}/mo it would never be paid off`;
  }
  return { warn: false, text: text + "." };
}
// Where a paid-off loan's payment goes: a group, or one account when that
// group is set per account.
function targetOptions() {
  const out = [];
  PROJ_GROUPS.forEach((g) => {
    if (proj.advanced[g.cat]) projAccounts(g.cat).forEach((a) => out.push({ value: "acct:" + a.name, label: `${g.label} · ${a.name}` }));
    else out.push({ value: "grp:" + g.cat, label: g.label });
  });
  return out;
}
function resolveTarget(target) {
  const opts = targetOptions();
  if (opts.some((o) => o.value === target)) return target;
  const cat = target.indexOf("grp:") === 0 ? target.slice(4)
    : ((DATA.accounts.find((a) => "acct:" + a.name === target) || {}).category || "Taxable investing");
  const inCat = opts.find((o) => o.value === "grp:" + cat) || opts.find((o) => o.value.indexOf("acct:") === 0 && projAccounts(cat).some((a) => "acct:" + a.name === o.value));
  return (inCat || opts[0] || { value: "grp:Taxable investing" }).value;
}

/* Switching a group to per-account starts each account from the group's
   settings: its return, and an even share of the monthly contribution — so
   flipping the switch doesn't move the projection until you change something. */
function seedAccounts(cat) {
  const accts = projAccounts(cat);
  if (!accts.length) return;
  const share = Math.round((monthlyFor(cat) / accts.length) * 100) / 100;
  const fresh = accts.every((a) => !isFinite(proj.acctMonthly[a.name]) && !isFinite(proj.acctReturns[a.name]));
  if (!fresh) return;           // keep what was typed last time it was on
  accts.forEach((a) => {
    proj.acctMonthly[a.name] = share;
    proj.acctReturns[a.name] = proj.returns[cat];
  });
}

const numField = (label, attr, key, value, affix, opts) =>
  `<label class="fld"><span>${label}</span><span class="in">`
  + (affix === "$" ? `<span class="affix">$</span>` : "")
  + `<input type="number" ${opts} inputmode="decimal" ${attr}="${esc(key)}" value="${value === "" ? "" : esc(value)}">`
  + (affix !== "$" ? `<span class="affix">${affix}</span>` : "")
  + `</span></label>`;

function renderProjForm() {
  document.getElementById("projForm").innerHTML = PROJ_GROUPS.map((g) => {
